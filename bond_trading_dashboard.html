<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
<title>债券现券交易分析看板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f5f6fa;
    --panel-bg: #ffffff;
    --text: #2c3e50;
    --text-secondary: #7f8c8d;
    --border: #e8ecf1;
    --primary: #5470c6;
    --primary-light: #e8edff;
    --hover: #f0f3ff;
    --tag-bg: #f0f4ff;
    --tag-text: #5470c6;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --radius: 8px;
    --sidebar-w: 320px;
    --success: #22c55e;
    --danger: #ef4444;
    --warning: #f59e0b;
    --info: #3b82f6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* ── Sidebar ── */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--panel-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow);
    z-index: 10;
    flex-shrink: 0;
  }

  .sidebar-header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  .sidebar-header h2 {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sidebar-header h2 .icon { font-size: 22px; }
  .sidebar-header .subtitle {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 4px;
  }
  .back-home {
    position: absolute; top: 20px; right: 24px;
    font-size: 12px; color: var(--text-secondary);
    text-decoration: none; padding: 4px 10px;
    border: 1px solid var(--border); border-radius: 4px;
    transition: all 0.15s;
  }
  .back-home:hover { color: var(--primary); border-color: var(--primary); }

  .filter-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .filter-group { display: flex; flex-direction: column; gap: 8px; }
  .filter-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .filter-label .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--primary);
  }

  .tag-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tag {
    padding: 5px 12px;
    border-radius: 16px;
    font-size: 12px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-secondary);
    transition: all 0.15s;
    user-select: none;
    white-space: nowrap;
  }
  .tag:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
  .tag.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  .date-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .date-row input[type="date"] {
    flex: 1;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
    color: var(--text);
    background: var(--bg);
    outline: none;
    transition: border-color 0.15s;
  }
  .date-row input[type="date"]:focus { border-color: var(--primary); }
  .date-row span { font-size: 12px; color: var(--text-secondary); }

  .sidebar-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .btn {
    padding: 10px 16px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
    font-family: inherit;
  }
  .btn-primary {
    background: var(--primary);
    color: #fff;
  }
  .btn-primary:hover { opacity: 0.9; }
  .btn-outline {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-outline:hover { border-color: var(--primary); color: var(--primary); }

  /* ── Main ── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .main-header {
    padding: 14px 28px;
    background: var(--panel-bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .main-header .title-area h3 {
    font-size: 16px;
    font-weight: 600;
  }
  .main-header .title-area .desc {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  .kpi-row {
    display: flex;
    gap: 12px;
  }
  .kpi-card {
    padding: 8px 14px;
    background: var(--bg);
    border-radius: 8px;
    text-align: center;
    min-width: 90px;
  }
  .kpi-card .kpi-value {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
  }
  .kpi-card .kpi-label {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 2px;
  }
  .kpi-card.positive .kpi-value { color: var(--danger); }
  .kpi-card.negative .kpi-value { color: var(--success); }

  .chart-area {
    flex: 1;
    padding: 12px 28px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow: hidden;
  }

  /* Top chart: daily bar */
  .chart-top {
    flex: 1;
    background: var(--panel-bg);
    border-radius: var(--radius);
    padding: 12px 20px 8px;
    box-shadow: var(--shadow);
    position: relative;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .chart-top .chart-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .chart-top .chart-label::before {
    content: '';
    display: inline-block;
    width: 8px; height: 8px;
    background: var(--primary);
    border-radius: 2px;
  }
  .chart-top .chart-wrap {
    flex: 1;
    min-height: 0;
    position: relative;
  }
  .chart-top canvas { width: 100% !important; height: 100% !important; }

  /* Bottom chart: cumulative line */
  .chart-bottom {
    flex: 1;
    background: var(--panel-bg);
    border-radius: var(--radius);
    padding: 12px 20px 8px;
    box-shadow: var(--shadow);
    position: relative;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .chart-bottom .chart-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .chart-bottom .chart-label::before {
    content: '';
    display: inline-block;
    width: 8px; height: 8px;
    background: var(--success);
    border-radius: 50%;
  }
  .chart-bottom .chart-wrap {
    flex: 1;
    min-height: 0;
    position: relative;
  }
  .chart-bottom canvas { width: 100% !important; height: 100% !important; }

  .no-data {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-secondary);
    font-size: 15px;
    flex-direction: column;
    gap: 8px;
  }
  .no-data .icon { font-size: 40px; opacity: 0.3; }

  /* Scrollbar */
  .filter-body::-webkit-scrollbar { width: 4px; }
  .filter-body::-webkit-scrollbar-track { background: transparent; }
  .filter-body::-webkit-scrollbar-thumb { background: #d0d5dd; border-radius: 4px; }

  /* Data source note */
  .source-note {
    padding: 8px 28px;
    font-size: 11px;
    color: var(--text-secondary);
    border-top: 1px solid var(--border);
    background: var(--panel-bg);
  }
</style>
</head>
<body>

<!-- ── Sidebar ── -->
<aside class="sidebar">
  <div class="sidebar-header">
    <h2><span class="icon">🏦</span>筛选条件</h2>
    <p class="subtitle">选择机构、券种、期限及时间范围</p>
    <a href="index.html" class="back-home">← 返回首页</a>
  </div>

  <div class="filter-body">
    <div class="filter-group">
      <label class="filter-label"><span class="dot"></span>机构类型</label>
      <div class="tag-grid" id="institution-tags"></div>
    </div>

    <div class="filter-group">
      <label class="filter-label"><span class="dot"></span>债券类型</label>
      <div class="tag-grid" id="bond-type-tags"></div>
    </div>

    <div class="filter-group">
      <label class="filter-label"><span class="dot"></span>期限</label>
      <div class="tag-grid" id="maturity-tags"></div>
    </div>

    <div class="filter-group">
      <label class="filter-label"><span class="dot"></span>时间范围</label>
      <div class="date-row">
        <input type="date" id="date-start" />
        <span>至</span>
        <input type="date" id="date-end" />
      </div>
    </div>
  </div>

  <div class="sidebar-footer">
    <button class="btn btn-primary" onclick="updateChart()">更新图表</button>
    <button class="btn btn-outline" onclick="resetFilters()">重置筛选</button>
  </div>
</aside>

<!-- ── Main Content ── -->
<main class="main">
  <div class="main-header">
    <div class="title-area">
      <h3 id="chart-title">各类型机构债券净买入走势</h3>
      <p class="desc" id="chart-desc">请选择机构和筛选条件后查看</p>
    </div>
    <div class="kpi-row">
      <div class="kpi-card" id="kpi-total"><div class="kpi-value">--</div><div class="kpi-label">累计净买入（亿元）</div></div>
      <div class="kpi-card" id="kpi-avg"><div class="kpi-value">--</div><div class="kpi-label">日均净买入（亿元）</div></div>
      <div class="kpi-card" id="kpi-days"><div class="kpi-value">--</div><div class="kpi-label">交易天数</div></div>
    </div>
  </div>

  <div class="chart-area">
    <!-- Top: Daily bar chart -->
    <div class="chart-top" id="chart-top-container">
      <div class="chart-label">日度净买入（亿元）</div>
      <div class="chart-wrap"><canvas id="chart-daily"></canvas></div>
      <div class="no-data" id="no-data-top" style="display:none">
        <span class="icon">📊</span>
        <span>请选择机构类型查看数据</span>
      </div>
    </div>

    <!-- Bottom: Cumulative line chart -->
    <div class="chart-bottom" id="chart-bottom-container">
      <div class="chart-label">累计净买入（亿元）</div>
      <div class="chart-wrap"><canvas id="chart-cumulative"></canvas></div>
      <div class="no-data" id="no-data-bottom" style="display:none">
        <span class="icon">📈</span>
        <span>请选择机构类型查看数据</span>
      </div>
    </div>
  </div>

  <div class="source-note">
    数据来源：bond_data.xlsx | 数据区间：2026-01-04 ~ 2026-06-16 | 净买入单位：亿元
  </div>
</main>

<script>
// ============================================
// Color palette for institutions
// ============================================
const INST_COLORS = [
  '#5470c6', '#91cc75', '#fac858', '#ee6666',
  '#73c0de', '#3ba272', '#fc8452', '#9a60b4',
];

// ============================================
// State
// ============================================
let allData = { detail: [], summary: [], meta: {} };
let chartDaily = null;
let chartCumulative = null;
let selectedInstitutions = new Set();
let selectedBondTypes = new Set();
let selectedMaturities = new Set();
let dataRendered = false;  // 首次渲染后才 true，防止后台更新时重置用户选择

// ============================================
// IndexedDB 缓存工具（解决 5.8MB 数据反复下载问题）
// ============================================
const IDB_NAME = 'ficc_cache';
const IDB_STORE = 'kv';
const CACHE_KEY_BTD = 'bond_trading_data';
const DATA_URL_BTD = 'bond_trading_data.json';

function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e.target.error);
  });
}
async function idbGet(key) {
  try {
    const db = await idbOpen();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  } catch (e) { return null; }
}
async function idbSet(key, val) {
  try {
    const db = await idbOpen();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(val, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) { console.warn('IndexedDB 写入失败', e); }
}

// 解压 compact_v1 格式
function decompressData(raw) {
  if (raw.meta && raw.meta.format === 'compact_v1' && raw.idx) {
    const idx = raw.idx;
    const mapRow = r => ({
      date: idx.dates[r[0]],
      bond_type: idx.bond_types[r[1]],
      institution: idx.institutions[r[2]],
      maturity: idx.maturities[r[3]],
      value: r[4],
    });
    return {
      meta: raw.meta,
      detail: raw.detail.map(mapRow),
      summary: raw.summary.map(mapRow),
    };
  }
  return raw;
}

// 从 allData 渲染 UI（首次设默认选择，后续更新保留用户选择）
function renderFromData() {
  const meta = allData.meta;
  const defaultStart = (meta.date_range[0] < '2026-01-01') ? '2026-01-01' : meta.date_range[0];
  document.getElementById('date-start').value = defaultStart;
  document.getElementById('date-end').value = meta.date_range[1];
  renderTagGroup('institution-tags', meta.institutions, selectedInstitutions, true);
  renderTagGroup('bond-type-tags', meta.bond_types, selectedBondTypes, false, true);
  renderTagGroup('maturity-tags', meta.maturities, selectedMaturities, false);
  if (!dataRendered) {
    const largeIdx = meta.institutions.indexOf('大型银行');
    if (largeIdx >= 0) selectedInstitutions.add('大型银行');
    const gzIdx = meta.bond_types.indexOf('国债');
    if (gzIdx >= 0) selectedBondTypes.add('国债');
    dataRendered = true;
  }
  refreshAllTags();
  updateChart();
}

// ============================================
// Initialize
// ============================================
async function init() {
  const noteEl = document.getElementById('source-note');
  const origNote = noteEl ? noteEl.textContent : '';

  // 1. 先从 IndexedDB 读缓存 → 命中则立即渲染（秒开）
  const cachedRaw = await idbGet(CACHE_KEY_BTD);
  if (cachedRaw) {
    allData = decompressData(cachedRaw);
    renderFromData();
    if (noteEl) noteEl.textContent = '✓ 已加载缓存数据，后台检查更新中...';
  } else {
    if (noteEl) noteEl.textContent = '⏳ 首次加载，正在下载数据（约 5.8MB）...';
  }

  // 2. 后台校验最新数据（带时间戳，强制绕过 CDN/浏览器缓存，确保拿到最新文件）
  try {
    const resp = await fetch(DATA_URL_BTD + '?t=' + Date.now());
    const raw = await resp.json();
    const newUpdated = raw.meta && raw.meta.last_updated;
    const cachedUpdated = cachedRaw && cachedRaw.meta && cachedRaw.meta.last_updated;

    if (newUpdated !== cachedUpdated) {
      // 数据有更新（或首次加载）
      allData = decompressData(raw);
      renderFromData();
      await idbSet(CACHE_KEY_BTD, raw);
      if (noteEl) {
        noteEl.textContent = '✓ 数据已更新至最新（' + (newUpdated || '未知') + '）';
        setTimeout(() => { if (noteEl.textContent.startsWith('✓ 数据已更新')) noteEl.textContent = origNote; }, 4000);
      }
    } else {
      if (noteEl) {
        noteEl.textContent = '✓ 数据已是最新';
        setTimeout(() => { if (noteEl.textContent.startsWith('✓ 数据已是最新')) noteEl.textContent = origNote; }, 3000);
      }
    }
  } catch (err) {
    console.error('Data load error:', err);
    if (!cachedRaw) {
      // 无缓存且网络失败 → 显示错误
      document.getElementById('no-data-top').style.display = 'flex';
      document.getElementById('no-data-top').querySelector('span:last-child').textContent =
        '数据加载失败，请确认 bond_trading_data.json 已生成';
      document.getElementById('no-data-bottom').style.display = 'flex';
      document.getElementById('no-data-bottom').querySelector('span:last-child').textContent =
        '数据加载失败';
      if (noteEl) noteEl.textContent = '✗ 数据加载失败';
    } else {
      // 有缓存，网络失败 → 继续用缓存
      if (noteEl) {
        noteEl.textContent = '⚠ 网络不可用，使用缓存数据（可能非最新）';
        setTimeout(() => { noteEl.textContent = origNote; }, 4000);
      }
    }
  }
}

function renderTagGroup(containerId, items, selectedSet, isMulti, singleByDefault) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';

  if (!isMulti && singleByDefault && selectedSet.size === 0 && items.length > 0) {
    selectedSet.add(items[0]);
  }

  items.forEach(item => {
    const tag = document.createElement('div');
    tag.className = 'tag' + (selectedSet.has(item) ? ' active' : '');
    tag.textContent = item;
    tag.onclick = () => {
      if (isMulti) {
        if (selectedSet.has(item)) {
          if (selectedSet.size > 1) selectedSet.delete(item);
        } else {
          selectedSet.add(item);
        }
      } else {
        if (!selectedSet.has(item)) {
          selectedSet.clear();
          selectedSet.add(item);
        }
      }
      refreshAllTags();
      updateChart();
    };
    container.appendChild(tag);
  });
}

function refreshAllTags() {
  const meta = allData.meta;
  refreshTagContainer('institution-tags', meta.institutions, selectedInstitutions);
  refreshTagContainer('bond-type-tags', meta.bond_types, selectedBondTypes);
  refreshTagContainer('maturity-tags', meta.maturities, selectedMaturities);
}

function refreshTagContainer(containerId, items, selectedSet) {
  const container = document.getElementById(containerId);
  const tags = container.querySelectorAll('.tag');
  tags.forEach((tag, i) => {
    if (i < items.length) {
      const item = items[i];
      tag.classList.toggle('active', selectedSet.has(item));
    }
  });
}

// ============================================
// Build data: filter + aggregate per institution
// ============================================
function buildSeries() {
  const startDate = document.getElementById('date-start').value;
  const endDate = document.getElementById('date-end').value;
  const instList = [...selectedInstitutions];
  const bondList = [...selectedBondTypes];
  const matList = [...selectedMaturities];

  const dateSet = new Set();
  const instDateValues = {};
  instList.forEach(inst => { instDateValues[inst] = {}; });

  allData.detail.forEach(row => {
    if (!selectedInstitutions.has(row.institution)) return;
    if (!selectedBondTypes.has(row.bond_type)) return;
    if (!selectedMaturities.has(row.maturity)) return;
    if (row.date < startDate || row.date > endDate) return;

    const inst = row.institution;
    const d = row.date;
    dateSet.add(d);
    instDateValues[inst][d] = (instDateValues[inst][d] || 0) + row.value;
  });

  const dates = [...dateSet].sort();

  return { dates, instList, instDateValues };
}

// ============================================
// Update Charts
// ============================================
function updateChart() {
  if (selectedInstitutions.size === 0) {
    showNoData('请选择至少一个机构类型');
    return;
  }

  const { dates, instList, instDateValues } = buildSeries();

  if (dates.length === 0) {
    showNoData('选定条件下无数据，请调整筛选条件');
    return;
  }

  const startDate = document.getElementById('date-start').value;
  const endDate = document.getElementById('date-end').value;
  const bondList = [...selectedBondTypes];
  const matList = [...selectedMaturities];

  // ── Compute daily & cumulative series ──
  let kpiTotal = 0;

  const dailyDatasets = instList.map((inst, i) => {
    const color = INST_COLORS[i % INST_COLORS.length];
    const data = dates.map(d => {
      const v = instDateValues[inst][d];
      return v !== undefined ? +v.toFixed(4) : 0;
    });
    return {
      label: inst,
      data,
      backgroundColor: color + '99',
      borderColor: color,
      borderWidth: 1,
      borderRadius: 2,
      barPercentage: 0.7,
      categoryPercentage: 0.9,
    };
  });

  const cumulativeDatasets = instList.map((inst, i) => {
    const color = INST_COLORS[i % INST_COLORS.length];
    let cum = 0;
    const data = dates.map(d => {
      const v = instDateValues[inst][d];
      if (v !== undefined) cum += v;
      return +cum.toFixed(4);
    });
    kpiTotal += cum;
    return {
      label: inst,
      data,
      borderColor: color,
      backgroundColor: color + '15',
      borderWidth: 2,
      pointRadius: 0,
      pointHoverRadius: 5,
      pointHoverBackgroundColor: color,
      tension: 0.15,
      fill: false,
    };
  });

  const kpiDays = dates.length;
  const kpiAvg = kpiTotal / kpiDays;

  // ── Update KPIs ──
  document.getElementById('kpi-total').querySelector('.kpi-value').textContent = kpiTotal.toFixed(2);
  document.getElementById('kpi-avg').querySelector('.kpi-value').textContent = kpiAvg.toFixed(2);
  document.getElementById('kpi-days').querySelector('.kpi-value').textContent = kpiDays;

  ['kpi-total', 'kpi-avg'].forEach(id => {
    const card = document.getElementById(id);
    const val = parseFloat(card.querySelector('.kpi-value').textContent);
    card.classList.remove('positive', 'negative');
    if (val > 0) card.classList.add('positive');
    else if (val < 0) card.classList.add('negative');
  });

  // ── Update title & description ──
  const bondStr = bondList.join('、') || '全部';
  const matStr = matList.join('、') || '全部';
  document.getElementById('chart-title').textContent =
    bondStr + ' · 各机构净买入走势';
  document.getElementById('chart-desc').textContent =
    '机构：' + instList.join('、') + ' | 期限：' + matStr + ' | ' + startDate + ' ~ ' + endDate;

  // ── Hide no-data messages, show canvases ──
  document.getElementById('no-data-top').style.display = 'none';
  document.getElementById('no-data-bottom').style.display = 'none';
  document.getElementById('chart-daily').style.display = 'block';
  document.getElementById('chart-cumulative').style.display = 'block';

  // ── Render daily bar chart ──
  if (chartDaily) chartDaily.destroy();
  chartDaily = new Chart(document.getElementById('chart-daily'), {
    type: 'bar',
    data: { labels: dates, datasets: dailyDatasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          position: 'top',
          labels: {
            usePointStyle: true,
            pointStyle: 'rectRounded',
            padding: 12,
            font: { size: 11 },
          },
        },
        tooltip: {
          backgroundColor: 'rgba(255,255,255,0.95)',
          titleColor: '#2c3e50',
          bodyColor: '#2c3e50',
          borderColor: '#e8ecf1',
          borderWidth: 1,
          cornerRadius: 6,
          padding: 12,
          callbacks: {
            label: function(ctx) {
              return ctx.dataset.label + ': ' + ctx.parsed.y.toFixed(2) + ' 亿';
            },
          },
        },
      },
      scales: {
        x: {
          stacked: false,
          ticks: { font: { size: 10 }, maxRotation: 0, maxTicksLimit: 14 },
          grid: { display: false },
        },
        y: {
          ticks: { font: { size: 10 }, callback: v => v.toFixed(0) + ' 亿' },
          grid: { color: '#f0f0f0' },
        },
      },
    },
    plugins: [zeroLinePlugin],
  });

  // ── Render cumulative line chart ──
  if (chartCumulative) chartCumulative.destroy();
  chartCumulative = new Chart(document.getElementById('chart-cumulative'), {
    type: 'line',
    data: { labels: dates, datasets: cumulativeDatasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          position: 'top',
          labels: {
            usePointStyle: true,
            pointStyleWidth: 8,
            padding: 12,
            font: { size: 11 },
          },
        },
        tooltip: {
          backgroundColor: 'rgba(255,255,255,0.95)',
          titleColor: '#2c3e50',
          bodyColor: '#2c3e50',
          borderColor: '#e8ecf1',
          borderWidth: 1,
          cornerRadius: 6,
          padding: 12,
          callbacks: {
            label: function(ctx) {
              return ctx.dataset.label + ': ' + (ctx.parsed.y !== null ? ctx.parsed.y.toFixed(2) : '--') + ' 亿';
            },
          },
        },
      },
      scales: {
        x: {
          ticks: { font: { size: 10 }, maxRotation: 0, maxTicksLimit: 14 },
          grid: { display: false },
        },
        y: {
          ticks: { font: { size: 10 }, callback: v => v.toFixed(0) + ' 亿' },
          grid: { color: '#f0f0f0' },
        },
      },
    },
    plugins: [zeroLinePlugin],
  });
}

// Zero-line plugin (reused by both charts)
const zeroLinePlugin = {
  id: 'zeroLine',
  beforeDraw: function(chart) {
    const ctx = chart.ctx;
    const yScale = chart.scales.y;
    if (!yScale) return;
    const y0 = yScale.getPixelForValue(0);
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(chart.scales.x.left, y0);
    ctx.lineTo(chart.scales.x.right, y0);
    ctx.strokeStyle = '#ccc';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.stroke();
    ctx.restore();
  },
};

function showNoData(msg) {
  document.getElementById('no-data-top').style.display = 'flex';
  document.getElementById('no-data-top').querySelector('span:last-child').textContent = msg;
  document.getElementById('no-data-bottom').style.display = 'flex';
  document.getElementById('no-data-bottom').querySelector('span:last-child').textContent = msg;
  document.getElementById('chart-daily').style.display = 'none';
  document.getElementById('chart-cumulative').style.display = 'none';
  document.getElementById('chart-title').textContent = '各类型机构债券净买入走势';
  document.getElementById('chart-desc').textContent = '请选择机构和筛选条件后查看';
  ['kpi-total', 'kpi-avg', 'kpi-days'].forEach(id => {
    document.getElementById(id).querySelector('.kpi-value').textContent = '--';
  });
}

function resetFilters() {
  const meta = allData.meta;
  selectedInstitutions.clear();
  selectedInstitutions.add(meta.institutions[0]);
  selectedBondTypes.clear();
  selectedBondTypes.add(meta.bond_types[2]); // 国债
  selectedMaturities.clear();

  document.getElementById('date-start').value = (meta.date_range[0] < '2026-01-01') ? '2026-01-01' : meta.date_range[0];
  document.getElementById('date-end').value = meta.date_range[1];

  refreshAllTags();
  updateChart();
}

// ============================================
// Start
// ============================================
// 监听时间范围变化
document.addEventListener('DOMContentLoaded', () => {
  const ds = document.getElementById('date-start');
  const de = document.getElementById('date-end');
  if (ds) ds.addEventListener('change', updateChart);
  if (de) de.addEventListener('change', updateChart);
});
init();
</script>
