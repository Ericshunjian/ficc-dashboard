<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>因子体检 · L2 有效性检验</title>
<script src="vendor/chart.umd.min.js"></script>
<style>
  :root {
    --bg:#f5f6fa; --panel-bg:#ffffff; --text:#2c3e50; --text-secondary:#7f8c8d;
    --border:#e8ecf1; --primary:#5470c6; --primary-light:#e8edff;
    --pos:#378ADD; --neg:#D85A30; --shadow:0 1px 3px rgba(0,0,0,0.06); --radius:8px;
    --detail-w:440px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column;
    overflow:hidden; font-size:13px; }
  header { background:var(--panel-bg); border-bottom:1px solid var(--border); padding:12px 18px;
    display:flex; align-items:center; gap:14px; flex-shrink:0; position:relative; }
  header h2 { font-size:17px; font-weight:600; }
  header .subtitle { font-size:12px; color:var(--text-secondary); }
  .back-home { position:absolute; top:12px; right:18px; font-size:12px; color:var(--text-secondary);
    text-decoration:none; padding:3px 8px; border:1px solid var(--border); border-radius:4px; }
  .back-home:hover { color:var(--primary); border-color:var(--primary); }
  .jump { font-size:12px; color:var(--text-secondary); text-decoration:none; padding:3px 8px;
    border:1px solid var(--border); border-radius:4px; margin-left:8px; }
  .jump:hover { color:var(--primary); border-color:var(--primary); }

  .toolbar { background:var(--panel-bg); border-bottom:1px solid var(--border); padding:10px 18px;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap; flex-shrink:0; }
  .seg { display:flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
  .seg button { border:none; background:var(--panel-bg); padding:5px 11px; font-size:12px;
    cursor:pointer; color:var(--text-secondary); border-right:1px solid var(--border); }
  .seg button:last-child { border-right:none; }
  .seg button.on { background:var(--primary); color:#fff; }
  .seg button:hover:not(.on) { background:var(--primary-light); }
  .fld { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-secondary); }
  .fld select, .fld input { border:1px solid var(--border); border-radius:5px; padding:4px 7px;
    font-size:12px; color:var(--text); background:var(--panel-bg); }
  .fld input[type=text] { width:150px; }
  .fld input[type=number] { width:64px; }
  .btn { border:1px solid var(--border); background:var(--panel-bg); border-radius:5px;
    padding:4px 10px; font-size:12px; cursor:pointer; color:var(--text); }
  .btn:hover { border-color:var(--primary); color:var(--primary); }
  .spacer { flex:1; }
  .stat { font-size:12px; color:var(--text-secondary); }
  /* 二级维度栏（随一级分组动态生成） */
  .dimbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:7px 14px; background:#fafbfc; border-bottom:1px solid var(--border); font-size:12px; }
  .dimbar .hint { color:var(--text-secondary); font-size:11px; }
  .dimbar .dimsep { width:1px; height:16px; background:var(--border); }
  tr.grp-row { background:#eef2f7; cursor:pointer; }
  tr.grp-row td { text-align:left; font-weight:600; font-size:11px; color:var(--text-secondary);
    padding:5px 8px; border-top:1px solid var(--border); border-bottom:1px solid var(--border);
    position:sticky; top:28px; z-index:1; }
  tr.grp-row:hover { background:#e4eaf3; }
  tr.grp-row .grp-n { font-weight:400; margin-left:6px; }
  tr.grp-row .grp-more { color:var(--primary); font-weight:400; margin-left:6px; text-decoration:underline; }
  .abs-sort { cursor:pointer; user-select:none; }
  .abs-sort input { cursor:pointer; }
  .abs-sort.on { color:var(--primary); font-weight:600; }

  .main { flex:1; display:flex; overflow:hidden; }
  .table-wrap { flex:1; overflow:auto; }
  table { border-collapse:collapse; width:100%; font-size:12px; }
  thead th { position:sticky; top:0; background:#fafbfc; border-bottom:1px solid var(--border);
    padding:7px 6px; text-align:right; font-weight:600; font-size:11px; color:var(--text-secondary);
    cursor:pointer; white-space:nowrap; z-index:2; }
  thead th:hover { background:var(--primary-light); }
  thead th.l { text-align:left; }
  thead th .ar { color:var(--primary); margin-left:2px; }
  tbody td { padding:5px 6px; border-bottom:1px solid #f0f2f5; text-align:right;
    white-space:nowrap; font-variant-numeric:tabular-nums; }
  tbody td.l { text-align:left; }
  tbody tr { cursor:pointer; }
  tbody tr:hover { background:var(--primary-light); }
  tbody tr.sel { background:#dce6ff; }
  tbody tr.sig1 td:first-child { box-shadow:inset 3px 0 0 var(--primary); }
  tbody tr.sig2 td:first-child { box-shadow:inset 3px 0 0 #1D9E75; }
  .yr { display:inline-flex; gap:2px; }
  .yr i { width:13px; height:13px; border-radius:2px; display:inline-block; background:#eef1f5; }
  .mono { font-weight:600; }
  .pos { color:var(--pos); } .neg { color:var(--neg); }

  aside.detail { width:var(--detail-w); background:var(--panel-bg); border-left:1px solid var(--border);
    overflow-y:auto; padding:16px 18px; flex-shrink:0; }
  aside.detail h3 { font-size:14px; font-weight:600; margin-bottom:4px; line-height:1.4; }
  aside.detail .meta { font-size:11px; color:var(--text-secondary); margin-bottom:12px; }
  .kpis { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
  .kpi { background:var(--bg); border-radius:6px; padding:7px 9px; }
  .kpi .v { font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; }
  .kpi .k { font-size:10px; color:var(--text-secondary); margin-top:1px; }
  .sec { margin-bottom:16px; }
  .sec h4 { font-size:12px; font-weight:600; color:var(--text-secondary); margin-bottom:6px; }
  .chart-box { height:150px; }
  .chart-box.tall { height:190px; }
  .hint { font-size:11px; color:var(--text-secondary); line-height:1.6; }
  .empty { color:var(--text-secondary); font-size:13px; padding:40px; text-align:center; }
  .loading { padding:40px; text-align:center; color:var(--text-secondary); }
  table.tinytip td { text-align:left; }
</style>
</head>
<body>

<header>
  <h2>🔬 因子体检</h2>
  <span class="subtitle" id="subtitle">加载中…</span>
  <a href="index.html" class="back-home">← 返回首页</a>
</header>

<div class="toolbar">
  <div class="fld">目标
    <select id="tgtSel"></select>
  </div>
  <div class="seg" id="nSeg"></div>
  <div class="seg" id="formSeg"></div>
  <div class="fld">分组
    <div class="seg" id="grpSeg"></div>
  </div>
  <div class="fld">显著
    <select id="sigSel">
      <option value="0">全部</option>
      <option value="1">独立样本 t 的 FDR 显著</option>
      <option value="2">置换检验也认可</option>
    </select>
  </div>
  <div class="fld">|IC| ≥ <input type="number" id="icMin" value="0" step="0.01" min="0" max="1"></div>
  <div class="fld"><input type="text" id="search" placeholder="搜索因子名"></div>
  <label class="fld abs-sort" title="数值列按绝对值大小排序（不论正负，找最强信号）">
    <input type="checkbox" id="absSort"> 按 |x| 排
  </label>
  <button class="btn" id="resetBtn">重置</button>
  <div class="spacer"></div>
  <span class="stat" id="stat"></span>
  <button class="btn" id="csvBtn">导出 CSV</button>
</div>

<div class="dimbar" id="dimBar"></div>

<div class="main">
  <div class="table-wrap">
    <div class="loading" id="loading">正在加载体检数据…</div>
    <table id="tbl" style="display:none">
      <thead><tr id="thr"></tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
  <aside class="detail" id="detail">
    <div class="empty">点击表格任意一行<br>查看该因子的完整体检报告</div>
  </aside>
</div>

<script>
var CK = null, LIB = null;
var IDX = {g:0,k:1,label:2,n:3,ic:4,icp:5,icir:6,t:7,ti:8,pind:9,win:10,wl:11,ws:12,pl:13,
  tail:14,q1:15,q2:16,q3:17,q4:18,q5:19,qd:20,qt:21,mono:22,turn:23,kurt:24,acf:25,
  p:26,pb:27,sig:28,h6:29,yr21:30,yr22:31,yr23:32,yr24:33,yr25:34,yr26:35,
  rgu:36,rgd:37,rghv:38,rglv:39};
var YRKEYS = ['yr21','yr22','yr23','yr24','yr25','yr26'];
var YRLABEL = ['21','22','23','24','25','26'];

var S = { tgt:'s3010', N:5, form:'pct', grp:'', dims:{}, sig:0, icmin:0, q:'',
          sort:'t', desc:true, absSort:false, sel:null, open:{}, allOpen:false, topN:10 };

/* ---------------- 因子分类 ----------------
   一级：数据大类（对应 factor_library 的分组）
   二级：组内维度，随一级动态生成下拉；筛选后表格按"第一个未筛选维度"分段折叠   */
var GROUPS = [
  {id:'',       name:'全部'},
  {id:'cash',   name:'机构行为·现券'},
  {id:'repo',   name:'机构行为·回购'},
  {id:'curve',  name:'估值·曲线期货'},
  {id:'derived',name:'机构行为·现券衍生'}
];
var FIELD_CN = {net:'净融出', rev_bal:'逆回购余额', repo_bal:'正回购余额', rate_spread:'正回购利率−DR001'};

/* k 的构成：cash = 券种|机构|期限 ；repo = 机构|字段 ；curve = 名称（类别取 label 首段） */
function parts(r){
  var k = String(r[IDX.k]).split('|');
  for(var i=0;i<k.length;i++) k[i]=k[i].trim();
  return k;
}
var DIMS = {
  cash: [
    {k:'inst', name:'机构', get:function(r){ return parts(r)[1]; }},
    {k:'bt',   name:'券种', get:function(r){ return parts(r)[0]; }},
    {k:'mat',  name:'期限', get:function(r){ return parts(r)[2]; }}
  ],
  repo: [
    {k:'inst',  name:'机构', get:function(r){ return parts(r)[0]; }},
    {k:'field', name:'字段', get:function(r){ return FIELD_CN[parts(r)[1]] || parts(r)[1]; }}
  ],
  curve: [
    {k:'cat', name:'类别', get:function(r){ return String(r[IDX.label]).split('·')[0]; }}
  ],
  /* derived 的 k = op|机构|期限档|类别（第四段为研报四分类，供二级筛选用） */
  derived: [
    {k:'cls',  name:'类别', get:function(r){ return parts(r)[3]; }},
    {k:'inst', name:'机构', get:function(r){ return parts(r)[1]; }},
    {k:'ten',  name:'期限档', get:function(r){ return parts(r)[2]; }}
  ]
};
function dimsOf(g){ return DIMS[g] || []; }
/* 当前分段键：一级为"全部"时按大类分；否则取组内第一个未筛选的维度 */
function segKey(){
  if(!S.grp) return {name:'大类', get:function(r){ return r[IDX.g]; }, cn:function(v){
    var o = GROUPS.filter(function(g){return g.id===v;})[0]; return o ? o.name : v; }};
  var ds = dimsOf(S.grp);
  for(var i=0;i<ds.length;i++){
    if(!S.dims[ds[i].k]) return {name:ds[i].name, key:ds[i].k, get:ds[i].get, cn:function(v){return v;}};
  }
  return null;
}
/* 从当前 block 抽取某维度的全部取值（按出现顺序去重） */
function dimValues(dimKey){
  var b = CK.blocks[blockKey()] || [], seen = [], out = [];
  var list = S.grp ? b.filter(function(r){ return r[IDX.g]===S.grp; }) : b;
  var ds = dimsOf(S.grp);
  for(var i=0;i<ds.length;i++){ if(ds[i].k===dimKey){
    list.forEach(function(r){
      var v = ds[i].get(r);
      if(v && v!=='undefined' && seen.indexOf(v)<0){ seen.push(v); out.push(v); }
    });
  }}
  return out;
}

/* 数值列才参与「按 |x| 排」；label 为字符串列，yr 不可排序 */
var NUMERIC_COLS = ['n','ic','icp','icir','t','ti','pind','p','win','pl','tail',
                    'q1','q2','q3','q4','q5','qd','qt','mono','turn','kurt','acf',
                    'pb','h6','rgu','rgd','rghv','rglv'];
function isNumericCol(k){ return NUMERIC_COLS.indexOf(k) >= 0; }
function invalid(v){
  if(v===null||v===undefined||v==='') return true;
  var n = Number(v);
  return !isFinite(n);
}

var COLS = [
  {k:'label', t:'因子', cls:'l', w:1},
  {k:'n',     t:'样本'},
  {k:'ic',    t:'IC'},
  {k:'icir',  t:'ICIR'},
  {k:'t',     t:'NW-t'},
  {k:'ti',    t:'独立样本t'},
  {k:'pind',  t:'p(独立)'},
  {k:'p',     t:'p置换'},
  {k:'win',   t:'胜率'},
  {k:'pl',    t:'盈亏比'},
  {k:'tail',  t:'尾部赔率'},
  {k:'qd',    t:'Q5−Q1'},
  {k:'qt',    t:'Q差t'},
  {k:'mono',  t:'单调'},
  {k:'turn',  t:'换手'},
  {k:'h6',    t:'近6月'},
  {k:'yr',    t:'分年 IC', cls:'l'},
];

function el(id){ return document.getElementById(id); }
/* 每个目标允许的周期：样本短的品种（TL 仅 2023-04 起）用 maxN 限制。
   注意：detail() 内有同名局部变量 tgtObj，故此处不能叫 tgtObj */
/* 分片按需加载：索引只有几 KB，真正的行数据在 checkup_b/b_<形态>_<目标>.json。
   每个分片含该 (形态,目标) 下全部周期，切 N 不再重新请求。 */
function ensureBlock(cb){
  var key = blockKey();
  if(CK.blocks[key] || !(CK.block_files||{})[key]){ if(cb) cb(); return; }
  var ps = key.split('|'), fm = ps[0], tg = ps[1], f = CK.block_files[key];
  el('loading').style.display='';
  el('loading').textContent='正在加载「'+fm+' / '+tg+'」这块数据…';
  fetch(f+'?t='+Date.now()).then(function(x){ return x.json(); }).then(function(j){
    var b = j.blocks||{};
    for(var N in b){ CK.blocks[fm+'|'+tg+'|'+N] = b[N]; }
    if(cb) cb();
  }).catch(function(){
    el('loading').textContent='数据加载失败，请刷新页面重试';
  });
}
function reload(){ ensureBlock(render); }

function tgtSpecOf(){ return (CK && CK.meta ? CK.meta.targets||[] : []).filter(function(t){ return t.id===S.tgt; })[0] || {}; }
function horizonsOf(t){ return ((CK&&CK.meta?CK.meta.horizons:null)||[1,5,10,20]).filter(function(n){ return !t.maxN || n<=t.maxN; }); }
function fmt(v, nd){
  if(v===null||v===undefined||isNaN(v)) return '—';
  return Number(v).toFixed(nd===undefined?3:nd);
}
function icColor(v){
  if(v===null||v===undefined||isNaN(v)) return '#eef1f5';
  var a = Math.min(1, Math.abs(v)/0.15);
  if(a < 0.08) return '#eef1f5';
  return v>0 ? 'rgba(55,138,221,'+(0.15+0.75*a)+')' : 'rgba(216,90,48,'+(0.15+0.75*a)+')';
}
function cls(v){ return (v===null||isNaN(v))?'':(v>0?'pos':'neg'); }

function load(){
  return fetch('factor_checkup.json?t='+Date.now())
    .then(function(r){ return r.json(); })
    .then(function(j){
      CK = j;
      var m = j.meta;
      el('subtitle').textContent =
        'L2 有效性检验 · ' + m.n_tests + ' 套 · 数据 '+m.date_range[0]+' ~ '+m.date_range[1]+
        ' · 因子滞后 '+m.lag+' 日 · '+m.bootstrap;
      if(m.p_dist){
        var pd=m.p_dist;
        el('subtitle').innerHTML += ' <b style="color:#D85A30">｜全局 p(置换) 分布：'+
          'P(p&lt;0.05)='+pd.p_lt_05+'（期望 0.05）· 中位数 '+pd.median+' → '+pd.verdict+'</b>';
      }
      var ts = el('tgtSel');
      m.targets.forEach(function(t){
        var o=document.createElement('option');
        o.value=t.id; o.textContent=t.name+' ('+t.unit+')'; ts.appendChild(o);
      });
      ts.value = S.tgt;
      buildNSeg();
      seg('formSeg', m.forms.map(function(f){return {v:f.id, t:f.name};}), 'form', function(v){ S.form=v; reload(); });
      seg('grpSeg', GROUPS.map(function(g){ return {v:g.id, t:g.name}; }), 'grp', function(v){
        S.grp=v; S.dims={}; S.open={}; S.allOpen=false; S.sel=null;
        buildHead(); render();
        el('detail').innerHTML='<div class="empty">点击表格任意一行<br>查看该因子的完整体检报告</div>';
        killCharts();
      });
      reload();
    });
}

function buildNSeg(){
  var hs = horizonsOf(tgtSpecOf());
  if(hs.indexOf(S.N) < 0) S.N = hs[hs.length-1] || 5;
  seg('nSeg', hs.map(function(n){ return {v:n, t:'N='+n}; }), 'N', function(v){ S.N=+v; reload(); });
}

function seg(id, items, key, cb){
  var box = el(id); box.innerHTML='';
  items.forEach(function(it){
    var b=document.createElement('button');
    b.textContent=it.t; b.setAttribute('data-v', it.v);
    if(String(S[key])===String(it.v)) b.className='on';
    b.onclick=function(){
      S[key]=it.v;
      Array.prototype.forEach.call(box.children, function(c){ c.className=''; });
      b.className='on';
      cb(it.v);
    };
    box.appendChild(b);
  });
}

function buildHead(){
  var tr = el('thr'); tr.innerHTML='';
  COLS.forEach(function(c){
    var th=document.createElement('th');
    th.textContent=c.t;
    if(c.cls) th.className=c.cls;
    if(S.sort===c.k){
      var ab = S.absSort && isNumericCol(c.k);
      th.innerHTML += '<span class="ar">'+(ab?'|':'')+(S.desc?'▼':'▲')+(ab?'|':'')+'</span>';
    }
    th.onclick=function(){
      if(c.k==='yr') return;
      if(S.sort===c.k) S.desc=!S.desc; else { S.sort=c.k; S.desc=true; }
      buildHead(); render();
    };
    tr.appendChild(th);
  });
}

function blockKey(){ return S.form+'|'+S.tgt+'|'+S.N; }

function rows(){
  var b = CK.blocks[blockKey()] || [];
  var ds = S.grp ? dimsOf(S.grp) : [];
  var out = b.filter(function(r){
    if(S.grp && r[IDX.g]!==S.grp) return false;
    if(S.sig && (r[IDX.sig]||0) < S.sig) return false;
    if(S.icmin && Math.abs(r[IDX.ic]||0) < S.icmin) return false;
    if(S.q && r[IDX.label].indexOf(S.q)<0) return false;
    for(var i=0;i<ds.length;i++){
      var v = S.dims[ds[i].k];
      if(v && ds[i].get(r)!==v) return false;
    }
    return true;
  });
  var sk = S.sort, d = S.desc?1:-1;
  var useAbs = S.absSort && isNumericCol(sk);
  out.sort(function(a,b){
    if(sk==='yr') return 0;
    /* 字符串列单独处理：不能用 invalid()(它走 Number()，中文恒为 NaN) */
    if(sk==='label'){
      var la = (a[IDX.label]===null||a[IDX.label]===undefined) ? '' : String(a[IDX.label]);
      var lb = (b[IDX.label]===null||b[IDX.label]===undefined) ? '' : String(b[IDX.label]);
      if(!la && !lb) return 0;
      if(!la) return 1;
      if(!lb) return -1;
      return d * la.localeCompare(lb, 'zh');
    }
    var va = a[IDX[sk]], vb = b[IDX[sk]];
    var ia = invalid(va), ib = invalid(vb);
    if(ia && ib) return 0;
    if(ia) return 1;              // 无效值恒沉底（不随升降序翻转）
    if(ib) return -1;
    var na = Number(va), nb = Number(vb);
    return useAbs ? d * (Math.abs(nb)-Math.abs(na)) : d * (nb - na);
  });
  return out;
}

/* 二级维度栏：随一级分组动态生成下拉 + 展开/收起 */
function buildDimBar(){
  var bar = el('dimBar'); bar.innerHTML='';
  if(!CK) return;
  if(!S.grp){
    var h0=document.createElement('span'); h0.className='hint';
    h0.textContent = '当前按「大类」分段，每组默认显示前 '+S.topN+
      ' 条（按当前排序列）· 点上方分组进入组内，可用维度进一步收窄';
    bar.appendChild(h0);
    /* 各大类的 p 值分布摘要：衍生层有没有自带信号，一眼可见 */
    var pb = CK.meta.p_dist_by_group;
    if(pb){
      Object.keys(pb).forEach(function(g){
        var d = pb[g];
        var s = document.createElement('span'); s.className='hint'; s.style.marginLeft='12px';
        s.textContent = d.name + '：P(p<0.05)=' + d.p_lt_05 + ' · 中位 ' + d.median +
          (d.sig_ind===undefined ? '' : (' · FDR显著 '+d.sig_ind+'（置换认可 '+d.sig_perm+'）'));
        bar.appendChild(s);
      });
    }
    return;
  }
  dimsOf(S.grp).forEach(function(d){
    var f=document.createElement('div'); f.className='fld';
    var lb=document.createElement('span'); lb.textContent=d.name; f.appendChild(lb);
    var sel=document.createElement('select');
    var o0=document.createElement('option'); o0.value=''; o0.textContent='全部'; sel.appendChild(o0);
    dimValues(d.k).forEach(function(v){
      var o=document.createElement('option'); o.value=v; o.textContent=v; sel.appendChild(o);
    });
    sel.value = S.dims[d.k] || '';
    sel.onchange=function(){ S.dims[d.k]=this.value; S.open={}; render(); };
    f.appendChild(sel); bar.appendChild(f);
  });
  var segk = segKey();
  var hint=document.createElement('span'); hint.className='hint';
  hint.textContent = segk ? ('当前按「'+segk.name+'」分段，每组默认 '+S.topN+' 条') : '已收窄到最细维度';
  bar.appendChild(hint);
  var sp=document.createElement('div'); sp.className='spacer'; bar.appendChild(sp);
  var bt=document.createElement('button'); bt.className='btn';
  bt.textContent = S.allOpen ? '收起全部' : '展开全部';
  bt.onclick=function(){ S.allOpen=!S.allOpen; S.open={}; render(); };
  bar.appendChild(bt);
}

function rowEl(r, tb){
    var tr=document.createElement('tr');
    if(S.sel && S.sel===r[IDX.k]) tr.className='sel';
    else if(r[IDX.sig]===2) tr.className='sig2';
    else if(r[IDX.sig]===1) tr.className='sig1';
    COLS.forEach(function(c){
      var td=document.createElement('td');
      if(c.cls) td.className=c.cls;
      if(c.k==='label'){ td.textContent=r[IDX.label]; }
      else if(c.k==='yr'){
        var h='<span class="yr">';
        YRKEYS.forEach(function(yk,i){
          var v=r[IDX[yk]];
          h+='<i style="background:'+icColor(v)+'" title="'+YRLABEL[i]+'年 IC='+fmt(v)+'"></i>';
        });
        h+='</span>'; td.innerHTML=h;
      }
      else {
        var v=r[IDX[c.k]];
        if(c.k==='p'||c.k==='pnw') td.textContent = fmt(v,3);
        else if(c.k==='mono'){ td.innerHTML = v===1?'<span class="mono pos">↑</span>':(v===-1?'<span class="mono neg">↓</span>':'—'); }
        else if(c.k==='turn') td.textContent = fmt(v,2);
        else td.textContent = fmt(v);
        if(c.k==='ic'||c.k==='t'||c.k==='qd'||c.k==='h6') td.className=(td.className+' '+cls(v)).trim();
      }
      tr.appendChild(td);
    });
    tr.onclick=function(){
      S.sel = r[IDX.k];
      Array.prototype.forEach.call(tb.children, function(x){
        if(!x.classList.contains('grp-row')) x.className='';
      });
      tr.className='sel';
      detail(r);
    };
    return tr;
}

function render(){
  if(!CK.blocks[blockKey()]){
    /* 该块尚未加载：显示 loading，由 ensureBlock 拉取后回调本函数 */
    el('tbl').style.display='none';
    el('loading').style.display='';
    el('loading').textContent='正在加载该块数据…';
    el('stat').textContent='';
    return;
  }
  el('tbl').style.display='';
  el('loading').style.display='none';
  var rs = rows();
  var tb = el('tb'); tb.innerHTML='';
  el('stat').textContent = rs.length + ' 行';
  buildDimBar();
  var sk = segKey();
  if(!sk){
    rs.forEach(function(r){ tb.appendChild(rowEl(r, tb)); });
  } else {
    /* 按分段键归组，保持全局排序；每组默认只显示 top N */
    var order = [], map = {};
    rs.forEach(function(r){
      var v = String(sk.get(r));
      if(!map[v]){ map[v]=[]; order.push(v); }
      map[v].push(r);
    });
    order.forEach(function(v){
      var list = map[v];
      var open = S.allOpen || !!S.open[v];
      var show = open ? list : list.slice(0, S.topN);
      var gtr = document.createElement('tr'); gtr.className='grp-row';
      var td = document.createElement('td'); td.colSpan = COLS.length;
      var name = sk.cn ? sk.cn(v) : v;
      td.textContent = name;
      var n = document.createElement('span'); n.className='grp-n';
      n.textContent = '· ' + list.length + ' 条'; td.appendChild(n);
      if(list.length > S.topN){
        var m = document.createElement('span'); m.className='grp-more';
        m.textContent = open ? '收起' : ('展开其余 ' + (list.length - show.length) + ' 条');
        td.appendChild(m);
      }
      gtr.appendChild(td);
      gtr.onclick = function(){
        S.open[v] = !open;
        if(!S.open[v]) S.allOpen = false;
        render();
      };
      tb.appendChild(gtr);
      show.forEach(function(r){ tb.appendChild(rowEl(r, tb)); });
    });
  }
  el('loading').style.display='none';
  el('tbl').style.display='';
}

/* ---------------- 详情面板 ---------------- */
var chartObjs = [];
function killCharts(){
  chartObjs.forEach(function(c){ try{ c.destroy(); }catch(e){} });
  chartObjs=[];
}
function mkChart(canvasId, cfg){
  var cv = document.getElementById(canvasId);
  if(!cv) return null;
  var c = new Chart(cv.getContext('2d'), cfg);
  chartObjs.push(c);
  return c;
}
var baseOpt = { responsive:true, maintainAspectRatio:false,
  plugins:{ legend:{display:false} },
  scales:{ x:{grid:{display:false}, ticks:{font:{size:10}}},
           y:{grid:{color:'#f0f2f5'}, ticks:{font:{size:10}}} } };

function detail(r){
  killCharts();
  var tgtName = (CK.meta.targets.filter(function(t){return t.id===S.tgt;})[0]||{}).name||S.tgt;

  function kpi(v,k,nd){ h+='<div class="kpi"><div class="v '+cls(v)+'">'+fmt(v,nd===undefined?3:nd)+'</div><div class="k">'+k+'</div></div>'; }
  kpi(r[IDX.ic],'IC (Spearman)');
  kpi(r[IDX.t],'NW-t',2);
  kpi(r[IDX.ti],'独立样本 t',2);
  kpi(r[IDX.pind],'p(独立)',3);
  kpi(r[IDX.p],'p 置换',3);
  kpi(r[IDX.icir],'ICIR');
  kpi(r[IDX.win],'胜率',3);
  kpi(r[IDX.pl],'盈亏比',2);
  kpi(r[IDX.tail],'尾部赔率',2);
  kpi(r[IDX.qd],'Q5−Q1 ('+unit+')',3);
  kpi(r[IDX.turn],'日均换手',2);
  kpi(r[IDX.h6],'近6月 IC');
  kpi(r[IDX.qt],'Q差 t',2);
  kpi(r[IDX.acf],'ACF(1)',2);
  h += '</div>';

  h += '<div class="sec"><h4>分组收益 Q1→Q5（按滚动 250 日 Z-score 五等分，单位 '+unit+'）</h4>';
  h += '<div class="chart-box"><canvas id="cGroup"></canvas></div></div>';

  h += '<div class="sec"><h4>分年 IC</h4>';
  h += '<div class="chart-box"><canvas id="cYear"></canvas></div></div>';

  h += '<div class="sec"><h4>衰减曲线（各周期 IC）</h4>';
  h += '<div class="chart-box"><canvas id="cDecay"></canvas></div></div>';

  h += '<div class="sec"><h4>环境稳定性（regime 分段 IC）</h4>';
  h += '<div class="chart-box"><canvas id="cReg"></canvas></div></div>';

  h += '<div class="sec"><h4>累计 IC（非重叠抽稀，步长 = N）</h4>';
  h += '<div class="chart-box"><canvas id="cCumIC"></canvas></div>';
  h += '<div class="hint" id="cumHint">加载中…</div></div>';

  h += '<div class="sec"><h4>信号累计净值（|Z|&gt;1 才持仓，未扣成本）</h4>';
  h += '<div class="chart-box"><canvas id="cPnl"></canvas></div>';
  h += '<div class="hint" id="pnlHint">加载中…</div></div>';

  h += '<div class="sec"><h4>分位区间条件分布（按滚动 250 日经验分位切区）</h4>';
  h += '<div class="chart-box"><canvas id="cCond"></canvas></div>';
  h += '<div id="condBox"><div class="hint">加载中…</div></div></div>';

  h += '<div class="sec"><h4>因子走势</h4>';
  h += '<div class="chart-box tall"><canvas id="cSeries"></canvas></div>';
  h += '<div class="hint" id="serHint">加载中…</div></div>';

  h += '<div class="sec"><h4>解读提示</h4><div class="hint">';
  var msg = [];
  var tgtObj = CK.meta.targets.filter(function(t){return t.id===S.tgt;})[0]||{};
  var sameSrc = (tgtObj.legs||[]).some(function(n){ return r[IDX.label].indexOf(n)>=0; });
  if(sameSrc) msg.push('⚠ 该因子就是预测目标的标的本身（或其组成部分），IC 只反映标的自身的均值回复/动量特性，不是外部增量信息。');
  if(Math.abs(r[IDX.ic]) < CK.meta.min_ic_strong && Math.abs(r[IDX.t])>2)
    msg.push('⚠ |IC| 低于门槛 '+CK.meta.min_ic_strong+' 但 t 值偏高：多半是极端值驱动的假信号，勿采信。');
  if(r[IDX.sig]===2) msg.push('✓ 通过最严格的置换检验（保留 y 全部自相关结构后仍显著），可信度最高。');
  else if(r[IDX.sig]===1) msg.push('○ 仅“不重叠子样本”判据的 FDR 显著，置换检验未认可——信号可能来自因子与目标的共同低频趋势，需谨慎。');
  else msg.push('× 未通过 FDR 校正，不能排除是多重检验下的巧合。');
  if(r[IDX.mono]===0 && Math.abs(r[IDX.qd])>0) msg.push('分组非单调：可能只有两端有效、中间是噪音（极值型信号）。');
  if(r[IDX.turn]!==null && r[IDX.turn]>0.3) msg.push('换手偏高（>0.3/日），成本敏感，需按实盘摩擦折扣。');
  var yrs = YRKEYS.map(function(k){return r[IDX[k]];});
  var pos = yrs.filter(function(v){return v!==null&&v>0;}).length;
  var neg = yrs.filter(function(v){return v!==null&&v<0;}).length;
  if(pos&&neg) msg.push('分年 IC 符号不稳（正 '+pos+' / 负 '+neg+' 年），可能存在 regime 依赖。');
  h += msg.join('<br>');
  h += '</div></div>';

  el('detail').innerHTML = h;

  // 分组收益
  var qv = [r[IDX.q1],r[IDX.q2],r[IDX.q3],r[IDX.q4],r[IDX.q5]];
  mkChart('cGroup', { type:'bar',
    data:{ labels:['Q1(最低)','Q2','Q3','Q4','Q5(最高)'],
      datasets:[{ data:qv, backgroundColor:qv.map(function(v){return icColor(v);}),
        borderWidth:0 }] },
    options: Object.assign({}, baseOpt, { plugins:{ legend:{display:false},
      tooltip:{callbacks:{label:function(c){ return fmt(c.parsed.y,3)+' '+unit; }}} } }) });

  // 分年
  mkChart('cYear', { type:'bar',
    data:{ labels:['2021','2022','2023','2024','2025','2026'],
      datasets:[{ data:yrs.map(function(v){return v===null?0:v;}),
        backgroundColor:yrs.map(function(v){return icColor(v);}), borderWidth:0 }] },
    options: Object.assign({}, baseOpt, { plugins:{ legend:{display:false},
      tooltip:{callbacks:{label:function(c){
        var v=yrs[c.dataIndex]; return v===null?'样本不足':fmt(v,3); }}} } }) });

  // 衰减：跨 N 取同一因子的 IC
  var ns = horizonsOf(tgtObj), dec = [];
  ns.forEach(function(n){
    var b = CK.blocks[S.form+'|'+S.tgt+'|'+n] || [];
    var f = b.filter(function(x){ return x[IDX.k]===r[IDX.k]; })[0];
    dec.push(f ? f[IDX.ic] : null);
  });
  mkChart('cDecay', { type:'line',
    data:{ labels:ns.map(function(n){return 'N='+n;}),
      datasets:[{ data:dec, borderColor:'#5470c6', backgroundColor:'#5470c6',
        pointRadius:4, spanGaps:true, tension:0.2 }] },
    options: Object.assign({}, baseOpt, { plugins:{ legend:{display:false} },
      scales:{ x:{grid:{display:false}}, y:{grid:{color:'#f0f2f5'},
        ticks:{font:{size:10}, callback:function(v){ return v.toFixed(2); }}} } }) });

  // regime
  var rgv=[r[IDX.rgu],r[IDX.rgd],r[IDX.rghv],r[IDX.rglv]];
  mkChart('cReg', { type:'bar',
    data:{ labels:['趋势上行段','趋势下行段','高波动段','低波动段'],
      datasets:[{ data:rgv.map(function(v){return v===null?0:v;}),
        backgroundColor:rgv.map(function(v){return icColor(v);}), borderWidth:0 }] },
    options: Object.assign({}, baseOpt, { indexAxis:'y',
      plugins:{ legend:{display:false}, tooltip:{callbacks:{label:function(c){
        var v=rgv[c.dataIndex]; return v===null?'样本不足':fmt(v,3); }}} },
      scales:{ x:{grid:{color:'#f0f2f5'}}, y:{grid:{display:false}, ticks:{font:{size:10}}} } }) });

  drawSeries(r[IDX.g], r[IDX.k]);

  // 详情扩展（累计 IC / 累计净值 / 条件分布）：独立文件，按需加载
  var blk = CK.blocks[S.form+'|'+S.tgt+'|'+S.N] || [];
  var ri = -1;
  for(var bi=0;bi<blk.length;bi++){ if(blk[bi][IDX.k]===r[IDX.k]){ ri=bi; break; } }
  drawExtras(ri, unit);
}

/* ---------- 详情扩展：按块懒加载 checkup_b/d_<形态>_<目标>.json ---------- */
var DET = null;
function drawExtras(ri, unit){
  if(ri < 0){ extrasFail('（未定位到该行）'); return; }
  var go_key = S.form+'|'+S.tgt+'|'+S.N;
  var go = function(det){
    var rows = (det.blocks||{})[go_key] || [];
    var d = rows[ri];
    if(!d){ extrasFail('（该行无详情数据）'); return; }
    drawCumIC(d[0][0]||[]);
    drawPnl(d[0][1]||[], unit);
    drawCond(d[1]||[], unit);
  };
  if(DET && DET.blocks[go_key]){ go(DET); return; }
  var df = (CK.detail_files||{})[go_key];
  if(!df){ extrasFail('（无该块的详情文件映射）'); return; }
  var ps0 = go_key.split('|'), dfm = ps0[0], dtg = ps0[1];
  fetch(df+'?t='+Date.now()).then(function(x){ return x.json(); })
    .then(function(j){
      if(!DET) DET = {blocks:{}};
      DET.cond_edges = j.cond_edges || DET.cond_edges || [0,10,25,50,75,90,100];
      DET.curve_pts = j.curve_pts || DET.curve_pts || 20;
      // ★ 分片文件内部 blocks 的 key 只有 N，必须与主表一致地补上「形态|目标|」前缀，
      //   否则 det.blocks[go_key] 永远取不到（所有因子都会显示"该行无详情数据"）
      var b = j.blocks||{};
      for(var N in b){ DET.blocks[dfm+'|'+dtg+'|'+N] = b[N]; }
      go(DET);
    })
    .catch(function(){ extrasFail('（详情数据加载失败）'); });
}
function extrasFail(m){
  ['cumHint','pnlHint'].forEach(function(id){ var e=el(id); if(e) e.textContent=m; });
  var b=el('condBox'); if(b) b.innerHTML='<div class="hint">'+m+'</div>';
}
function drawCumIC(cum){
  if(!cum.length){ el('cumHint').textContent='（样本不足）'; return; }
  var ic=[], i;
  for(i=0;i<cum.length;i++) ic.push(i===0?cum[0]:cum[i]-cum[i-1]);
  var mu=ic.reduce(function(a,b){return a+b;},0)/ic.length;
  var sd=Math.sqrt(ic.reduce(function(a,b){return a+(b-mu)*(b-mu);},0)/Math.max(ic.length-1,1));
  var up=[], dn=[], labels=[];
  for(i=0;i<cum.length;i++){ var b=1.96*sd*Math.sqrt(i+1); up.push(b); dn.push(-b); labels.push(String(i+1)); }
  mkChart('cCumIC', { type:'line',
    data:{ labels:labels, datasets:[
      { data:up, borderColor:'#dcdcdc', borderWidth:1, pointRadius:0, fill:'+1',
        backgroundColor:'rgba(140,140,140,0.12)', label:'+1.96σ' },
      { data:dn, borderColor:'#dcdcdc', borderWidth:1, pointRadius:0, fill:false, label:'−1.96σ' },
      { data:cum, borderColor:'#5470c6', borderWidth:2, pointRadius:0, tension:0.08, label:'累计 IC' }
    ]},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{callbacks:{label:function(c){
        return c.dataIndex===cum.length-1||c.datasetIndex===2 ? '累计 IC '+fmt(c.parsed.y,2) : ''; }}} },
      scales:{ x:{grid:{display:false}, ticks:{font:{size:9}, maxTicksLimit:10}},
               y:{grid:{color:'#f0f2f5'}, ticks:{font:{size:10}}} } } });
  el('cumHint').textContent = '共 '+cum.length+' 个非重叠期（每 '+S.N+' 个交易日一期，故各期近似独立）。'
    + '灰色带为零假设下 ±1.96σ√t 的随机游走区间——曲线跑出带外才说明是真信号，'
    + '在带内单调上升只是自相关造成的假象。';
}
function drawPnl(p, unit){
  if(!p.length){ el('pnlHint').textContent='（样本不足）'; return; }
  var last=p[p.length-1], mx=Math.max.apply(null,p), mn=Math.min.apply(null,p);
  mkChart('cPnl', { type:'line',
    data:{ labels:p.map(function(_,i){return String(i+1);}),
      datasets:[{ data:p, borderColor:last>=0?'#c0392b':'#27ae60', borderWidth:2,
        pointRadius:0, tension:0.08, fill:false }] },
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{callbacks:{label:function(c){
        return fmt(c.parsed.y,2)+' '+unit; }}} },
      scales:{ x:{grid:{display:false}, ticks:{font:{size:9}, maxTicksLimit:10}},
               y:{grid:{color:'#f0f2f5'}, ticks:{font:{size:10}}} } } });
  el('pnlHint').textContent = '期末 '+fmt(last,2)+' '+unit+' · 峰值 '+fmt(mx,2)+' · 谷值 '+fmt(mn,2)
    + ' ｜ 未扣交易成本，换手高的因子需自行打折。';
}
function drawCond(cond, unit){
  var edges = (DET && DET.cond_edges) || [0,10,25,50,75,90,100];
  var labels=[], mean=[], up=[], n=[], med=[], sd=[], p5=[];
  for(var i=0;i<cond.length;i++){
    var c=cond[i];
    labels.push(edges[i]+'–'+edges[i+1]+'%');
    n.push(c[0]); mean.push(c[1]); med.push(c[2]); sd.push(c[3]); up.push(c[4]); p5.push(c[5]);
  }
  var bg = mean.map(function(v){ return v===null?'#cccccc':(v>0?'#27ae60':'#c0392b'); });
  mkChart('cCond', { type:'bar',
    data:{ labels:labels, datasets:[
      { type:'bar', data:mean.map(function(v){return v===null?0:v;}), backgroundColor:bg,
        borderWidth:0, yAxisID:'y', order:2 },
      { type:'line', data:up.map(function(v){return v===null?null:v;}), borderColor:'#534AB7',
        backgroundColor:'#534AB7', borderWidth:2, pointRadius:4, pointStyle:'rectRot',
        tension:0.15, yAxisID:'y1', order:1 }
    ]},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{callbacks:{label:function(c){
        if(c.dataset.type==='line') return '上行概率 '+fmt(c.parsed.y,1)+'%';
        var i=c.dataIndex;
        return '均值 '+fmt(mean[i],3)+' '+unit+'（n='+n[i]+'，标准差 '+fmt(sd[i],2)+'）';
      }}} },
      scales:{ x:{grid:{display:false}, ticks:{font:{size:10}, autoSkip:false}},
               y:{grid:{color:'#f0f2f5'}, ticks:{font:{size:10}},
                  title:{display:true, text:'未来 '+S.N+' 日变动均值（'+unit+'）', font:{size:10}}},
               y1:{position:'right', grid:{display:false}, ticks:{font:{size:10}},
                  title:{display:true, text:'上行概率 %', font:{size:10}}} } } });
  var h = '<table style="width:100%;border-collapse:collapse;font-size:12px;margin-top:8px">'
    + '<thead><tr style="color:#888;border-bottom:1px solid #eee">'
    + '<th style="text-align:left;padding:4px">分位区间</th><th style="padding:4px">n</th>'
    + '<th style="padding:4px">均值</th><th style="padding:4px">中位</th><th style="padding:4px">标准差</th>'
    + '<th style="padding:4px">上行概率</th><th style="padding:4px">5% 分位</th></tr></thead><tbody>';
  for(var j=0;j<cond.length;j++){
    var q=cond[j];
    h += '<tr style="border-bottom:1px solid #fafafa">'
      + '<td style="padding:4px">'+labels[j]+'</td>'
      + '<td style="padding:4px;text-align:right">'+q[0]+'</td>'
      + '<td style="padding:4px;text-align:right;color:'+(q[1]===null?'#999':(q[1]>0?'#27ae60':'#c0392b'))+'">'+fmt(q[1],3)+'</td>'
      + '<td style="padding:4px;text-align:right">'+fmt(q[2],3)+'</td>'
      + '<td style="padding:4px;text-align:right">'+fmt(q[3],3)+'</td>'
      + '<td style="padding:4px;text-align:right">'+fmt(q[4],1)+'%</td>'
      + '<td style="padding:4px;text-align:right">'+fmt(q[5],3)+'</td></tr>';
  }
  h += '</tbody></table>';
  var spread = (mean[0]!==null && mean[mean.length-1]!==null) ? Math.abs(mean[0]-mean[mean.length-1]) : null;
  var mxu = Math.max.apply(null, up.filter(function(v){return v!==null;}));
  var mnu = Math.min.apply(null, up.filter(function(v){return v!==null;}));
  var tip = '这张表用来捞 <b>B 类（区域）因子</b>和 <b>C 类（风险）因子</b>：'
    + '线性 IC 检验只看均值单调性，会漏掉「非单调但区间差异大」和「均值无差异但尾部/波动差异大」的因子。';
  if(mxu-mnu >= 10) tip += ' ⚠ 各区间上行概率极差 '+(mxu-mnu).toFixed(1)+' 个百分点，'
    + '存在明显的区域效应，建议按阈值触发而非线性打分。';
  var sds = sd.filter(function(v){return v!==null;});
  if(sds.length>1 && Math.max.apply(null,sds)/Math.min.apply(null,sds) > 1.5)
    tip += ' ⚠ 各区间标准差相差 '+(Math.max.apply(null,sds)/Math.min.apply(null,sds)).toFixed(2)
      + ' 倍，该因子更像风险/赔率指标（决定仓位与止损），不宜当方向信号。';
  h += '<div class="hint" style="margin-top:8px">'+tip+'</div>';
  el('condBox').innerHTML = h;
}

/* 懒加载因子库并画走势 */
function drawSeries(g, k){
  var draw = function(){
    if(!LIB){ el('serHint').textContent='（因子库未加载）'; return; }
    var s = null;
    var arr = LIB[g==='cash'?'cash':(g==='repo'?'repo':'curve')] || [];
    for(var i=0;i<arr.length;i++){
      var kk = g==='cash' ? (arr[i].bt+'|'+arr[i].inst+'|'+arr[i].mat)
             : g==='repo' ? (arr[i].inst+'|'+arr[i].field) : arr[i].name;
      if(kk===k){ s=arr[i]; break; }
    }
    if(!s){ el('serHint').textContent='（未找到该序列）'; return; }
    var D = LIB.dates.length;
    var raw = new Array(D).fill(null);
    for(var j=0;j<s.v.length;j++) raw[s.i0+j] = s.v[j];
    var form = S.form;
    var v = raw.slice();
    if(form==='pct') v = rollingPct(maNan(raw,10), 60);
    else if(form==='diff'){ v = new Array(D).fill(null); for(var t=5;t<D;t++) v[t]=(raw[t]===null||raw[t-5]===null)?null:raw[t]-raw[t-5]; }
    // 只画最近 500 天
    var lo = Math.max(0, D-500);
    mkChart('cSeries', { type:'line',
      data:{ labels: LIB.dates.slice(lo), datasets:[{ data:v.slice(lo), borderColor:'#5470c6',
        borderWidth:1.2, pointRadius:0, spanGaps:false }] },
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{legend:{display:false}},
        scales:{ x:{grid:{display:false}, ticks:{font:{size:9}, maxTicksLimit:8}},
                 y:{grid:{color:'#f0f2f5'}, ticks:{font:{size:10}}} } } });
    el('serHint').textContent = '最近 500 个交易日 · 形态：'+S.form;
  };
  if(LIB){ draw(); return; }
  fetch('factor_library.json?t='+Date.now()).then(function(r){return r.json();})
    .then(function(j){ LIB=j; draw(); })
    .catch(function(){ el('serHint').textContent='（加载失败）'; });
}
function maNan(a,w){
  var n=a.length, out=new Array(n).fill(null), s=0, c=0;
  for(var i=0;i<n;i++){
    if(i>=w && a[i-w]!==null && !isNaN(a[i-w])){ s-=a[i-w]; c--; }
    if(a[i]!==null && !isNaN(a[i])){ s+=a[i]; c++; }
    if(i>=w-1 && c >= w*0.7) out[i]=s/c;
  }
  return out;
}
function rollingPct(a,w){
  var n=a.length, out=new Array(n).fill(null);
  for(var i=w-1;i<n;i++){
    var cur=a[i], le=0, eq=0, cnt=0;
    if(cur===null||isNaN(cur)) continue;
    for(var j=i-w+1;j<=i;j++){
      var x=a[j]; if(x===null||isNaN(x)) continue;
      cnt++; if(x<cur) le++; else if(x===cur) eq++;
    }
    if(cnt>0) out[i]=(le+0.5*eq)/cnt*100;
  }
  return out;
}

el('icMin').oninput  = function(){ S.icmin=+this.value||0; S.open={}; render(); };
el('search').oninput = function(){ S.q=this.value.trim(); S.open={}; render(); };
el('absSort').onchange = function(){
  S.absSort = this.checked;
  this.parentNode.className = 'fld abs-sort' + (this.checked?' on':'');
  buildHead(); render();
};
el('resetBtn').onclick = function(){
  S.grp=''; S.dims={}; S.open={}; S.allOpen=false;
  S.sig=0; S.icmin=0; S.q=''; S.absSort=false;
  S.sort='t'; S.desc=true; S.sel=null;
  seg('grpSeg', GROUPS.map(function(g){ return {v:g.id, t:g.name}; }), 'grp',
      function(v){ S.grp=v; S.dims={}; S.open={}; render(); });
  el('sigSel').value='0'; el('icMin').value='0'; el('search').value='';
  el('absSort').checked=false; el('absSort').parentNode.className='fld abs-sort';
  buildHead(); reload();
  el('detail').innerHTML='<div class="empty">点击表格任意一行<br>查看该因子的完整体检报告</div>';
  killCharts();
};
el('csvBtn').onclick = function(){
  var rs = rows(), hdr = COLS.map(function(c){return c.t;}).join(',');
  var lines=[hdr];
  rs.forEach(function(r){
    lines.push(COLS.map(function(c){
      if(c.k==='yr') return YRKEYS.map(function(yk){ var v=r[IDX[yk]]; return v===null?'':v; }).join(' ');
      var v=r[IDX[c.k]];
      if(c.k==='label') return '"'+v+'"';
      return (v===null||v===undefined)?'':v;
    }).join(','));
  });
  var blob = new Blob(['\ufeff'+lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='因子体检_'+S.tgt+'_N'+S.N+'_'+S.form+'.csv';
  a.click();
};
