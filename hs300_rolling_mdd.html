  ['平均回撤', st.mean+'%'],
  ['中位数', st.median+'%'],
  ['标准差', st.std+'%'],
  ['最深回撤', st.min_mdd+'%'],
  ['最浅回撤', st.max_mdd+'%'],
  ['P5', st.p5+'%'],
  ['P25', st.p25+'%'],
  ['P50', st.p50+'%'],
  ['P75', st.p75+'%'],
  ['P95', st.p95+'%'],
  ['历史最深回撤日', D.worst_date+' ('+D.worst_val+'%)'],
];
document.getElementById('stat').innerHTML =
  '<tr><th>指标</th><th>数值</th></tr>' +
  rows.map(r=>`<tr><td>${r[0]}</td><td class="neg">${r[1]}</td></tr>`).join('');
</script>
