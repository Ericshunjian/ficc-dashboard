<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
<title>量化策略回测 · FICC 看板</title>
<style>
  :root {
    --bg: #f5f7fa;
    --panel-bg: #ffffff;
    --text: #2c3e50;
    --text-secondary: #7f8c8d;
    --border: #e8ecf1;
    --primary: #5470c6;
    --accent: #ee6666;
    --success: #91cc75;
    --warning: #fac858;
    --shadow: 0 1px 3px rgba(0,0,0,0.06);
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* Top Bar */
  .topbar {
    height: 56px;
    background: var(--panel-bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 20px;
  }
  .topbar .back-link {
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 6px;
  }
  .topbar .back-link:hover { background: var(--bg); color: var(--primary); }
  .topbar h1 { font-size: 16px; font-weight: 700; flex: 1; }
  .topbar .tabs { display: flex; gap: 4px; background: var(--bg); padding: 4px; border-radius: 8px; }
  .topbar .tab {
    padding: 6px 16px; font-size: 13px; font-weight: 500;
    color: var(--text-secondary); cursor: pointer; border-radius: 6px;
    border: none; background: transparent;
  }
  .topbar .tab.active { background: var(--panel-bg); color: var(--primary); box-shadow: var(--shadow); }

  /* Layout */
  .layout { display: flex; min-height: calc(100vh - 56px); }
  .sidebar {
    width: 300px; background: var(--panel-bg); border-right: 1px solid var(--border);
    overflow-y: auto; padding: 16px 20px; flex-shrink: 0;
  }
  .main {
    flex: 1; display: flex; flex-direction: column;
    padding: 16px; gap: 12px; min-width: 0;
  }

  /* Sidebar */
  .sidebar-header { padding-bottom: 12px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .sidebar-header h2 { font-size: 16px; font-weight: 700; }
  .sidebar-header .subtitle { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
  .filter-group { margin-bottom: 18px; }
  .filter-label {
    font-size: 12px; font-weight: 600; margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .filter-label .dot { width: 6px; height: 6px; background: var(--primary); border-radius: 50%; }
  .hint { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
  select, input[type="number"], input[type="date"] {
    width: 100%; padding: 7px 10px; border: 1px solid var(--border);
    border-radius: 6px; font-size: 13px; background: var(--panel-bg); color: var(--text); outline: none;
  }
  select:focus, input:focus { border-color: var(--primary); }
  .param-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .param-row label { font-size: 12px; color: var(--text-secondary); min-width: 60px; }
  .param-row input { flex: 1; }
  .param-row .unit { font-size: 11px; color: var(--text-secondary); min-width: 24px; }
  .checkbox-row {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; margin-bottom: 6px; cursor: pointer;
  }
  .checkbox-row input { width: auto; }
  .btn-run {
    width: 100%; padding: 10px; background: var(--primary); color: white;
    border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .btn-run:hover { background: #4a63b8; }
  .btn-reset {
    width: 100%; padding: 8px; background: var(--bg); color: var(--text-secondary);
    border: 1px solid var(--border); border-radius: 6px; font-size: 12px; cursor: pointer; margin-top: 6px;
  }

  /* Main area */
  .kpi-bar { display: flex; gap: 12px; flex-shrink: 0; flex-wrap: wrap; }
  .kpi {
    flex: 1; min-width: 100px; background: var(--panel-bg); border-radius: var(--radius);
    padding: 10px 16px; box-shadow: var(--shadow);
  }
  .kpi-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 2px; }
  .kpi-value { font-size: 18px; font-weight: 700; }
  .kpi-value.pos { color: var(--success); }
  .kpi-value.neg { color: var(--accent); }

  .chart-area { display: flex; flex-direction: column; gap: 12px; }
  .chart-box {
    background: var(--panel-bg); border-radius: var(--radius); padding: 12px 20px 8px;
    box-shadow: var(--shadow); min-height: 200px; display: flex; flex-direction: column;
  }
  .chart-box.flex-2 { min-height: 280px; }
  .chart-label {
    font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px;
  }
  .chart-wrap { flex: 1; position: relative; min-height: 180px; }
  .status-msg {
    text-align: center; padding: 40px; color: var(--text-secondary); font-size: 13px;
  }
  .status-msg .icon { font-size: 32px; display: block; margin-bottom: 8px; }
  .error-msg { color: var(--accent); }

  /* Trade table */
  .trade-table-box {
    background: var(--panel-bg); border-radius: var(--radius); padding: 12px 20px;
    box-shadow: var(--shadow); max-height: 200px; overflow-y: auto;
  }
  .trade-table-box h3 { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--border); }
  th { color: var(--text-secondary); font-weight: 600; position: sticky; top: 0; background: var(--panel-bg); }
  td:first-child, th:first-child { text-align: left; }
  tr:hover td { background: var(--bg); }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="topbar">
  <a class="back-link" href="index.html">← 返回首页</a>
  <h1>量化策略回测</h1>
  <div class="tabs">
    <button class="tab active" id="tab-cta" onclick="switchTab('cta')">CTA 趋势追踪</button>
    <button class="tab" id="tab-arb" onclick="switchTab('arb')">价差套利</button>
  </div>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>⚡ 回测参数</h2>
      <p class="subtitle" id="sidebar-subtitle">CTA 趋势追踪 · 单标的</p>
    </div>

    <!-- CTA Config -->
    <div id="cta-config">

        <select id="cta-signal" onchange="toggleCtaParams()">
          <option value="ma">双均线交叉</option>

      <div class="filter-group" id="ma-params">
        <label class="filter-label"><span class="dot"></span>均线参数</label>
        <div class="param-row"><label>快线</label><input type="number" id="ma-fast" value="5" min="2" max="60"><span class="unit">日</span></div>
        <div class="param-row"><label>慢线</label><input type="number" id="ma-slow" value="20" min="5" max="120"><span class="unit">日</span></div>
      </div>

      <div class="filter-group hidden" id="bb-params">
        <label class="filter-label"><span class="dot"></span>布林带参数</label>
        <div class="param-row"><label>窗口</label><input type="number" id="bb-window" value="20" min="5" max="120"><span class="unit">日</span></div>
        <div class="param-row"><label>带宽</label><input type="number" id="bb-width" value="2" min="0.5" max="4" step="0.1"><span class="unit">σ</span></div>
      </div>

      <div class="filter-group">
        <label class="filter-label"><span class="dot"></span>方向设置</label>
        <label class="checkbox-row"><input type="checkbox" id="cta-allow-short" checked> 允许做空</label>
        <label class="checkbox-row"><input type="checkbox" id="cta-reverse"> 反向交易</label>
      </div>

      <div class="filter-group">
        <label class="filter-label"><span class="dot"></span>回测设置</label>
        <div class="param-row"><label>起始</label><input type="date" id="cta-date-start"></div>
        <div class="param-row"><label>结束</label><input type="date" id="cta-date-end"></div>
        <div class="param-row"><label>成本</label><input type="number" id="cta-cost" value="0" min="0" step="0.5"><span class="unit">bp/次</span></div>
      </div>

      <button class="btn-run" onclick="runCtaBacktest()">运行回测</button>
      <button class="btn-reset" onclick="resetCta()">重置参数</button>
    </div>

    <!-- Arbitrage Config -->
    <div id="arb-config" class="hidden">
      <div class="filter-group">
        <label class="filter-label"><span class="dot"></span>标的 A</label>
        <select id="arb-target-a"><option value="">加载中...</option></select>
      </div>

      <div class="filter-group">
        <label class="filter-label"><span class="dot"></span>标的 B</label>
        <select id="arb-target-b"><option value="">加载中...</option></select>
      </div>

      <div class="filter-group">
        <label class="filter-label"><span class="dot"></span>信号参数（价差双均线）</label>
        <div class="param-row"><label>快线</label><input type="number" id="arb-ma-fast" value="5" min="2" max="60"><span class="unit">日</span></div>
        <div class="param-row"><label>慢线</label><input type="number" id="arb-ma-slow" value="20" min="5" max="120"><span class="unit">日</span></div>
      </div>

      <div class="filter-group">
        <label class="filter-label"><span class="dot"></span>方向设置</label>
        <label class="checkbox-row"><input type="checkbox" id="arb-allow-short" checked> 允许做空价差</label>
      </div>

      <div class="filter-group">
        <label class="filter-label"><span class="dot"></span>回测设置</label>
        <div class="param-row"><label>起始</label><input type="date" id="arb-date-start"></div>
        <div class="param-row"><label>结束</label><input type="date" id="arb-date-end"></div>
        <div class="param-row"><label>成本</label><input type="number" id="arb-cost" value="0" min="0" step="0.5"><span class="unit">bp/次</span></div>
      </div>

      <button class="btn-run" onclick="runArbBacktest()">运行回测</button>
      <button class="btn-reset" onclick="resetArb()">重置参数</button>
    </div>
  </div>

  <div class="main">
    <div class="kpi-bar">
      <div class="kpi"><div class="kpi-label">累计盈亏</div><div class="kpi-value" id="kpi-total">--</div></div>
      <div class="kpi"><div class="kpi-label">年化收益</div><div class="kpi-value" id="kpi-annual">--</div></div>
      <div class="kpi"><div class="kpi-label">最大回撤</div><div class="kpi-value" id="kpi-dd">--</div></div>
      <div class="kpi"><div class="kpi-label">夏普比率</div><div class="kpi-value" id="kpi-sharpe">--</div></div>
      <div class="kpi"><div class="kpi-label">胜率</div><div class="kpi-value" id="kpi-winrate">--</div></div>
      <div class="kpi"><div class="kpi-label">交易次数</div><div class="kpi-value" id="kpi-trades">--</div></div>
    </div>

    <div class="chart-area">
      <div class="chart-box flex-2">
        <div class="chart-label" id="label-top">标的走势 + 开仓标记</div>
        <div class="chart-wrap" id="wrap-price">
          <div class="status-msg" id="status-price">
            <span class="icon">⏳</span>
            <span id="status-price-text">正在加载数据...</span>
          </div>
          <canvas id="chart-price" style="display:none;"></canvas>
        </div>
      </div>
      <div class="chart-box flex-2">
        <div class="chart-label">策略净值（累计 bp）</div>
        <div class="chart-wrap" id="wrap-equity">
          <div class="status-msg"><span class="icon">📋</span><span>运行回测后显示</span></div>
          <canvas id="chart-equity" style="display:none;"></canvas>
        </div>
      </div>
      <div class="chart-box">
        <div class="chart-label">回撤曲线（bp）</div>
        <div class="chart-wrap" id="wrap-dd">
          <div class="status-msg"><span class="icon">📋</span><span>运行回测后显示</span></div>
          <canvas id="chart-dd" style="display:none;"></canvas>
        </div>
      </div>
    </div>

    <div class="trade-table-box">
      <h3>交易明细</h3>
      <table id="trade-table">
        <thead>
          <tr>
            <th>方向</th><th>开仓日期</th><th>开仓价</th><th>平仓日期</th><th>平仓价</th><th>持仓天数</th><th>盈亏(bp)</th>
          </tr>
        </thead>
        <tbody id="trade-tbody"><tr><td colspan="7" style="text-align:center;color:#999;padding:12px">运行回测后显示</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
<script>
// ============================================
// Data
// ============================================
let curveData = null;
let bondData = null;
let allTargets = [];
let chartPrice = null, chartEquity = null, chartDd = null;

// ============================================
// Init
// ============================================
async function init() {
  console.log('[backtest] init start');
  try {
    const [r1, r2] = await Promise.all([
      fetch('yield_curve_data.json?t=' + Date.now()),
      fetch('bond_yield_data.json?t=' + Date.now()),
    ]);
    curveData = await r1.json();
    bondData = await r2.json();
    console.log('[backtest] data loaded, curves:', Object.keys(curveData.series || {}).length, 'bonds:', Object.keys(bondData.series || {}).length);

    buildTargetPool();
    fillTargetSelectors();
    setDefaultDates();

    document.getElementById('status-price').innerHTML = '<span class="icon">📊</span><span>选择标的和参数后点击"运行回测"</span>';
  } catch (err) {
    console.error('[backtest] init error:', err);
    document.getElementById('status-price').innerHTML = '<span class="icon">⚠️</span><span class="error-msg">数据加载失败: ' + err.message + '</span>';
  }
}

function buildTargetPool() {
  allTargets = [];
  if (curveData && curveData.series) {
    for (const [name, s] of Object.entries(curveData.series)) {
      if (!s.dates || !s.values) continue;
      allTargets.push({ name, source: '曲线', dates: s.dates, values: s.values });
    }
  }
  if (bondData && bondData.series) {
    for (const [code, s] of Object.entries(bondData.series)) {
      if (!s.dates || !s.yields) continue;
      allTargets.push({ name: code, source: '个券', dates: s.dates, values: s.yields });
    }
  }
  allTargets.sort((a, b) => a.name.localeCompare(b.name, 'zh'));
  console.log('[backtest] target pool:', allTargets.length);
}

function fillTargetSelectors() {
  const opts = allTargets.map(t => {
    const tag = t.source === '曲线' ? '' : ' [个券]';
    return `<option value="${t.name}">${t.name}${tag}</option>`;
  }).join('');
  ['cta-target', 'arb-target-a', 'arb-target-b'].forEach(id => {
    document.getElementById(id).innerHTML = opts;
  });
  if (allTargets.length >= 2) {
    document.getElementById('arb-target-b').value = allTargets[1].name;
  }
}

function setDefaultDates() {
  const today = new Date().toISOString().slice(0, 10);
  ['cta-date-start', 'arb-date-start'].forEach(id => {
    document.getElementById(id).value = '2026-01-01';
  });
  ['cta-date-end', 'arb-date-end'].forEach(id => {
    document.getElementById(id).value = today;
  });
}

// ============================================
// Tab switching
// ============================================
function switchTab(tab) {
  const ctaCfg = document.getElementById('cta-config');
  const arbCfg = document.getElementById('arb-config');
  if (tab === 'cta') {
    ctaCfg.classList.remove('hidden');
    arbCfg.classList.add('hidden');
    document.getElementById('tab-cta').classList.add('active');
    document.getElementById('tab-arb').classList.remove('active');
    document.getElementById('sidebar-subtitle').textContent = 'CTA 趋势追踪 · 单标的';
    document.getElementById('label-top').textContent = '标的走势 + 开仓标记';
  } else {
    ctaCfg.classList.add('hidden');
    arbCfg.classList.remove('hidden');
    document.getElementById('tab-cta').classList.remove('active');
    document.getElementById('tab-arb').classList.add('active');
    document.getElementById('sidebar-subtitle').textContent = '价差套利 · 双标的';
    document.getElementById('label-top').textContent = '价差走势 + 开仓标记';
  }
}

function toggleCtaParams() {
  const sig = document.getElementById('cta-signal').value;
  document.getElementById('ma-params').classList.toggle('hidden', sig !== 'ma');
  document.getElementById('bb-params').classList.toggle('hidden', sig !== 'bb');
}

// ============================================
// Backtest Engine
// ============================================
function sma(values, window) {
  const result = new Array(values.length).fill(null);
  let sum = 0;
  for (let i = 0; i < values.length; i++) {
    sum += values[i];
    if (i >= window) sum -= values[i - window];
    if (i >= window - 1) result[i] = sum / window;
  }
  return result;
}

function rollingStd(values, window) {
  const result = new Array(values.length).fill(null);
  const ma = sma(values, window);
  for (let i = window - 1; i < values.length; i++) {
    let sumSq = 0;
    for (let j = i - window + 1; j <= i; j++) sumSq += Math.pow(values[j] - ma[i], 2);
    result[i] = Math.sqrt(sumSq / window);
  }
  return result;
}

function alignSeries(a, b) {
  const mapA = {}, mapB = {};
  a.dates.forEach((d, i) => { if (a.values[i] != null) mapA[d] = a.values[i]; });
  b.dates.forEach((d, i) => { if (b.values[i] != null) mapB[d] = b.values[i]; });
  const common = a.dates.filter(d => d in mapA && d in mapB);
  return { dates: common, valuesA: common.map(d => mapA[d]), valuesB: common.map(d => mapB[d]) };
}

function filterByDate(dates, arrays, startDate, endDate) {
  const start = startDate || '1900-01-01';
  const end = endDate || '2999-12-31';
  const idx = [];
  for (let i = 0; i < dates.length; i++) {
    if (dates[i] >= start && dates[i] <= end) idx.push(i);
  }
  return { dates: idx.map(i => dates[i]), arrays: arrays.map(arr => idx.map(i => arr[i])) };
}

function ctaBacktest(values, dates, params) {
  const n = values.length;
  if (n < 30) return null;

  let fastLine, slowLine, upperBand, lowerBand, midLine;
  if (params.signal === 'ma') {
    fastLine = sma(values, params.maFast);
    slowLine = sma(values, params.maSlow);
  } else {
    midLine = sma(values, params.bbWindow);
    const std = rollingStd(values, params.bbWindow);
    upperBand = midLine.map((m, i) => m != null && std[i] != null ? m + params.bbWidth * std[i] : null);
    lowerBand = midLine.map((m, i) => m != null && std[i] != null ? m - params.bbWidth * std[i] : null);
  }

  const rawSignals = new Array(n).fill(0);
  let position = 0;
  for (let i = 1; i < n; i++) {
    if (params.signal === 'ma') {
      if (fastLine[i] == null || slowLine[i] == null || fastLine[i-1] == null || slowLine[i-1] == null) {
        rawSignals[i] = position; continue;
      }
      if (fastLine[i-1] <= slowLine[i-1] && fastLine[i] > slowLine[i]) position = 1;
      else if (fastLine[i-1] >= slowLine[i-1] && fastLine[i] < slowLine[i]) position = params.allowShort ? -1 : 0;
      rawSignals[i] = position;
    } else {
      if (upperBand[i] == null || lowerBand[i] == null || midLine[i] == null) {
        rawSignals[i] = position; continue;
      }
      if (values[i] > upperBand[i] && values[i-1] <= upperBand[i-1]) position = 1;
      else if (values[i] < lowerBand[i] && values[i-1] >= lowerBand[i-1] && params.allowShort) position = -1;
      else if ((position === 1 && values[i] < midLine[i]) || (position === -1 && values[i] > midLine[i])) position = 0;
      rawSignals[i] = position;
    }
  }
  const signals = params.reverse ? rawSignals.map(s => -s) : rawSignals;

  const dailyPnl = new Array(n).fill(0);
  const positions = new Array(n).fill(0);
  let tradeCost = 0;
  for (let i = 1; i < n; i++) {
    const prevPos = signals[i - 1];
    positions[i] = signals[i];
    dailyPnl[i] = (values[i] - values[i - 1]) * 100 * prevPos;
    if (signals[i] !== signals[i - 1]) { dailyPnl[i] -= params.cost; tradeCost += params.cost; }
  }

  const equity = new Array(n).fill(0);
  let cum = 0;
  for (let i = 0; i < n; i++) { cum += dailyPnl[i]; equity[i] = cum; }

  const drawdown = new Array(n).fill(0);
  let peak = 0;
  for (let i = 0; i < n; i++) { peak = Math.max(peak, equity[i]); drawdown[i] = equity[i] - peak; }

  const trades = [];
  let tradeOpen = null;
  for (let i = 0; i < n; i++) {
    if (signals[i] !== 0 && (i === 0 || signals[i - 1] !== signals[i])) {
      tradeOpen = { direction: signals[i], openDate: dates[i], openValue: values[i], openIdx: i };
    }
    if (tradeOpen && (signals[i] === 0 || i === n - 1)) {
      const closeValue = values[i];
      const pnl = (closeValue - tradeOpen.openValue) * tradeOpen.direction * 100 - params.cost * 2;
      trades.push({
        direction: tradeOpen.direction, openDate: tradeOpen.openDate, openValue: tradeOpen.openValue,
        closeDate: dates[i], closeValue, days: i - tradeOpen.openIdx, pnl
      });
      tradeOpen = null;
    }
  }

  const totalPnl = equity[n - 1];
  const annualPnl = totalPnl / n * 252;
  const maxDd = Math.min(...drawdown);
  const dailyReturns = dailyPnl.slice(1).filter(v => v !== 0);
  const meanRet = dailyReturns.length > 0 ? dailyReturns.reduce((a, b) => a + b, 0) / dailyReturns.length : 0;
  const stdRet = dailyReturns.length > 0 ? Math.sqrt(dailyReturns.reduce((a, b) => a + (b - meanRet) ** 2, 0) / dailyReturns.length) : 0;
  const sharpe = stdRet > 0 ? (meanRet / stdRet) * Math.sqrt(252) : 0;
  const winTrades = trades.filter(t => t.pnl > 0).length;
  const winRate = trades.length > 0 ? (winTrades / trades.length * 100) : 0;

  return {
    signals, positions, dailyPnl, equity, drawdown, trades,
    kpi: { total: totalPnl, annual: annualPnl, maxDd, sharpe, winRate, tradeCount: trades.length, cost: tradeCost },
    indicators: { fastLine, slowLine, upperBand, lowerBand, midLine }
  };
}

function arbBacktest(spreadValues, dates, params) {
  const n = spreadValues.length;
  if (n < 30) return null;

  const fastLine = sma(spreadValues, params.maFast);
  const slowLine = sma(spreadValues, params.maSlow);

  const rawSignals = new Array(n).fill(0);
  let position = 0;
  for (let i = 1; i < n; i++) {
    if (fastLine[i] == null || slowLine[i] == null || fastLine[i-1] == null || slowLine[i-1] == null) {
      rawSignals[i] = position; continue;
    }
    if (fastLine[i-1] <= slowLine[i-1] && fastLine[i] > slowLine[i]) position = 1;
    else if (fastLine[i-1] >= slowLine[i-1] && fastLine[i] < slowLine[i]) position = params.allowShort ? -1 : 0;
    rawSignals[i] = position;
  }
  const signals = rawSignals;

  const dailyPnl = new Array(n).fill(0);
  let tradeCost = 0;
  for (let i = 1; i < n; i++) {
    const prevPos = signals[i - 1];
    dailyPnl[i] = (spreadValues[i] - spreadValues[i - 1]) * 100 * prevPos;
    if (signals[i] !== signals[i - 1]) { dailyPnl[i] -= params.cost; tradeCost += params.cost; }
  }

  const equity = new Array(n).fill(0);
  let cum = 0;
  for (let i = 0; i < n; i++) { cum += dailyPnl[i]; equity[i] = cum; }

  const drawdown = new Array(n).fill(0);
  let peak = 0;
  for (let i = 0; i < n; i++) { peak = Math.max(peak, equity[i]); drawdown[i] = equity[i] - peak; }

  const trades = [];
  let tradeOpen = null;
  for (let i = 0; i < n; i++) {
    if (signals[i] !== 0 && (i === 0 || signals[i - 1] !== signals[i])) {
      tradeOpen = { direction: signals[i], openDate: dates[i], openValue: spreadValues[i], openIdx: i };
    }
    if (tradeOpen && (signals[i] === 0 || i === n - 1)) {
      const pnl = (spreadValues[i] - tradeOpen.openValue) * tradeOpen.direction * 100 - params.cost * 2;
      trades.push({
        direction: tradeOpen.direction, openDate: tradeOpen.openDate, openValue: tradeOpen.openValue,
        closeDate: dates[i], closeValue: spreadValues[i], days: i - tradeOpen.openIdx, pnl
      });
      tradeOpen = null;
    }
  }

  const totalPnl = equity[n - 1];
  const annualPnl = totalPnl / n * 252;
  const maxDd = Math.min(...drawdown);
  const dailyReturns = dailyPnl.slice(1).filter(v => v !== 0);
  const meanRet = dailyReturns.length > 0 ? dailyReturns.reduce((a, b) => a + b, 0) / dailyReturns.length : 0;
  const stdRet = dailyReturns.length > 0 ? Math.sqrt(dailyReturns.reduce((a, b) => a + (b - meanRet) ** 2, 0) / dailyReturns.length) : 0;
  const sharpe = stdRet > 0 ? (meanRet / stdRet) * Math.sqrt(252) : 0;
  const winTrades = trades.filter(t => t.pnl > 0).length;
  const winRate = trades.length > 0 ? (winTrades / trades.length * 100) : 0;

  return {
    signals, dailyPnl, equity, drawdown, trades,
    kpi: { total: totalPnl, annual: annualPnl, maxDd, sharpe, winRate, tradeCount: trades.length, cost: tradeCost },
    indicators: { fastLine, slowLine }
  };
}

// ============================================
// Run Backtest
// ============================================
function runCtaBacktest() {
  const targetName = document.getElementById('cta-target').value;
  if (!targetName) return alert('请先选择标的');
  const target = allTargets.find(t => t.name === targetName);
  if (!target) return alert('找不到标的: ' + targetName);

  const params = {
    signal: document.getElementById('cta-signal').value,
    maFast: parseInt(document.getElementById('ma-fast').value),
    maSlow: parseInt(document.getElementById('ma-slow').value),
    bbWindow: parseInt(document.getElementById('bb-window').value),
    bbWidth: parseFloat(document.getElementById('bb-width').value),
    allowShort: document.getElementById('cta-allow-short').checked,
    reverse: document.getElementById('cta-reverse').checked,
    cost: parseFloat(document.getElementById('cta-cost').value) || 0,
  };
  if (params.maFast >= params.maSlow) return alert('快线窗口应小于慢线窗口');

  const startDate = document.getElementById('cta-date-start').value;
  const endDate = document.getElementById('cta-date-end').value;
  const { dates, arrays } = filterByDate(target.dates, [target.values], startDate, endDate);
  if (dates.length < 30) return alert('数据不足 30 天（当前 ' + dates.length + ' 天），无法回测');

  const result = ctaBacktest(arrays[0], dates, params);
  if (!result) return alert('回测失败');
  renderResults(result, dates, arrays[0], params, 'cta');
}

function runArbBacktest() {
  const nameA = document.getElementById('arb-target-a').value;
  const nameB = document.getElementById('arb-target-b').value;
  if (!nameA || !nameB) return alert('请选择两个标的');
  if (nameA === nameB) return alert('请选择两个不同的标的');

  const targetA = allTargets.find(t => t.name === nameA);
  const targetB = allTargets.find(t => t.name === nameB);
  if (!targetA || !targetB) return alert('找不到标的');

  const params = {
    maFast: parseInt(document.getElementById('arb-ma-fast').value),
    maSlow: parseInt(document.getElementById('arb-ma-slow').value),
    allowShort: document.getElementById('arb-allow-short').checked,
    cost: parseFloat(document.getElementById('arb-cost').value) || 0,
  };
  if (params.maFast >= params.maSlow) return alert('快线窗口应小于慢线窗口');

  const startDate = document.getElementById('arb-date-start').value;
  const endDate = document.getElementById('arb-date-end').value;
  const aligned = alignSeries(targetA, targetB);
  const { dates, arrays } = filterByDate(aligned.dates, [aligned.valuesA, aligned.valuesB], startDate, endDate);
  if (dates.length < 30) return alert('共同日期不足 30 天（当前 ' + dates.length + ' 天），无法回测');

  const spreadValues = arrays[0].map((a, i) => a - arrays[1][i]);
  const result = arbBacktest(spreadValues, dates, params);
  if (!result) return alert('回测失败');
  renderResults(result, dates, spreadValues, params, 'arb');
}

// ============================================
// Render
// ============================================
function renderResults(result, dates, values, params, mode) {
  const kpi = result.kpi;
  const fmt = (v, suffix = '') => v != null && !isNaN(v) ? v.toFixed(1) + suffix : '--';
  const setKpi = (id, val, cls) => {
    const el = document.getElementById(id);
    el.textContent = val;
    el.className = 'kpi-value' + (cls ? ' ' + cls : '');
  };
  setKpi('kpi-total', fmt(kpi.total, ' bp'), kpi.total >= 0 ? 'pos' : 'neg');
  setKpi('kpi-annual', fmt(kpi.annual, ' bp'), kpi.annual >= 0 ? 'pos' : 'neg');
  setKpi('kpi-dd', fmt(kpi.maxDd, ' bp'), 'neg');
  setKpi('kpi-sharpe', fmt(kpi.sharpe));
  setKpi('kpi-winrate', fmt(kpi.winRate, '%'));
  setKpi('kpi-trades', kpi.tradeCount);

  renderPriceChart(dates, values, result, mode);
  renderEquityChart(dates, result.equity);
  renderDdChart(dates, result.drawdown);
  renderTradeTable(result.trades);
}

function showCanvas(wrapId, canvasId) {
  const wrap = document.getElementById(wrapId);
  const status = wrap.querySelector('.status-msg');
  const canvas = document.getElementById(canvasId);
  if (status) status.style.display = 'none';
  canvas.style.display = 'block';
}

function renderPriceChart(dates, values, result, mode) {
  if (chartPrice) chartPrice.destroy();
  showCanvas('wrap-price', 'chart-price');

  const datasets = [{
    label: mode === 'cta' ? '标的收益率 (%)' : '价差 (%)',
    data: values, borderColor: '#5470c6', borderWidth: 1.5, pointRadius: 0, tension: 0.15
  }];
  if (result.indicators.fastLine) {
    datasets.push({ label: '快线', data: result.indicators.fastLine, borderColor: '#ee6666', borderWidth: 1, borderDash: [3,3], pointRadius: 0, tension: 0.15 });
    datasets.push({ label: '慢线', data: result.indicators.slowLine, borderColor: '#91cc75', borderWidth: 1, borderDash: [3,3], pointRadius: 0, tension: 0.15 });
  }
  if (result.indicators.upperBand) {
    datasets.push({ label: '上轨', data: result.indicators.upperBand, borderColor: '#ee666680', borderWidth: 1, pointRadius: 0, tension: 0.15 });
    datasets.push({ label: '中轨', data: result.indicators.midLine, borderColor: '#fac858', borderWidth: 1, pointRadius: 0, tension: 0.15 });
    datasets.push({ label: '下轨', data: result.indicators.lowerBand, borderColor: '#91cc7580', borderWidth: 1, pointRadius: 0, tension: 0.15 });
  }

  // 开仓标记点
  const longPoints = [], shortPoints = [];
  const sigs = result.signals;
  for (let i = 0; i < sigs.length; i++) {
    if (i === 0) continue;
    if (sigs[i] === 1 && sigs[i-1] !== 1) longPoints.push({ x: i, y: values[i] });
    if (sigs[i] === -1 && sigs[i-1] !== -1) shortPoints.push({ x: i, y: values[i] });
  }
  datasets.push({
    label: '做多', data: longPoints.map(p => p.y), borderColor: 'transparent',
    backgroundColor: '#ee6666', pointStyle: 'triangle', pointRadius: 7, showLine: false
  });
  datasets.push({
    label: '做空', data: shortPoints.map(p => p.y), borderColor: 'transparent',
    backgroundColor: '#91cc75', pointStyle: 'crossRot', pointRadius: 7, showLine: false
  });

  chartPrice = new Chart(document.getElementById('chart-price'), {
    type: 'line',
    data: { labels: dates, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'top', labels: { usePointStyle: true, padding: 10, font: { size: 10 } } },
        tooltip: { backgroundColor: 'rgba(255,255,255,0.95)', titleColor: '#2c3e50', bodyColor: '#2c3e50', borderColor: '#e8ecf1', borderWidth: 1 },
      },
      scales: {
        x: { ticks: { font: { size: 10 }, maxRotation: 0, maxTicksLimit: 12 }, grid: { display: false } },
        y: { ticks: { font: { size: 10 }, callback: v => v.toFixed(2) + '%' }, grid: { color: '#f0f0f0' } },
      },
    }
  });
}

function renderEquityChart(dates, equity) {
  if (chartEquity) chartEquity.destroy();
  showCanvas('wrap-equity', 'chart-equity');
  chartEquity = new Chart(document.getElementById('chart-equity'), {
    type: 'line',
    data: { labels: dates, datasets: [{
      label: '累计盈亏 (bp)', data: equity, borderColor: '#5470c6',
      backgroundColor: 'rgba(84,112,198,0.1)', borderWidth: 1.5, pointRadius: 0, fill: true, tension: 0.15
    }]},
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => c.parsed.y.toFixed(1) + ' bp' } } },
      scales: {
        x: { ticks: { font: { size: 10 }, maxRotation: 0, maxTicksLimit: 12 }, grid: { display: false } },
        y: { ticks: { font: { size: 10 }, callback: v => v.toFixed(0) + ' bp' }, grid: { color: '#f0f0f0' } },
      },
    }
  });
}

function renderDdChart(dates, drawdown) {
  if (chartDd) chartDd.destroy();
  showCanvas('wrap-dd', 'chart-dd');
  chartDd = new Chart(document.getElementById('chart-dd'), {
    type: 'line',
    data: { labels: dates, datasets: [{
      label: '回撤 (bp)', data: drawdown, borderColor: '#ee6666',
      backgroundColor: 'rgba(238,102,102,0.15)', borderWidth: 1, pointRadius: 0, fill: true, tension: 0.15
    }]},
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => c.parsed.y.toFixed(1) + ' bp' } } },
      scales: {
        x: { ticks: { font: { size: 10 }, maxRotation: 0, maxTicksLimit: 12 }, grid: { display: false } },
        y: { ticks: { font: { size: 10 } }, grid: { color: '#f0f0f0' } },
      },
    }
  });
}

function renderTradeTable(trades) {
  const tbody = document.getElementById('trade-tbody');
  if (trades.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#999;padding:12px">无交易记录</td></tr>';
    return;
  }
  tbody.innerHTML = trades.slice().reverse().map(t => {
    const dirText = t.direction === 1 ? '多' : '空';
    const dirColor = t.direction === 1 ? '#ee6666' : '#91cc75';
    const pnlColor = t.pnl >= 0 ? '#91cc75' : '#ee6666';
    return `<tr>
      <td style="color:${dirColor};font-weight:600">${dirText}</td>
      <td>${t.openDate}</td><td>${t.openValue.toFixed(3)}%</td>
      <td>${t.closeDate}</td><td>${t.closeValue.toFixed(3)}%</td>
      <td>${t.days}</td><td style="color:${pnlColor};font-weight:600">${t.pnl.toFixed(1)}</td>
    </tr>`;
  }).join('');
}

function resetCta() {
  document.getElementById('cta-signal').value = 'ma';
  document.getElementById('ma-fast').value = 5;
  document.getElementById('ma-slow').value = 20;
  document.getElementById('bb-window').value = 20;
  document.getElementById('bb-width').value = 2;
  document.getElementById('cta-allow-short').checked = true;
  document.getElementById('cta-reverse').checked = false;
  document.getElementById('cta-cost').value = 0;
  toggleCtaParams();
}

function resetArb() {
  document.getElementById('arb-ma-fast').value = 5;
  document.getElementById('arb-ma-slow').value = 20;
  document.getElementById('arb-allow-short').checked = true;
  document.getElementById('arb-cost').value = 0;
}

// Start
init();
</script>
