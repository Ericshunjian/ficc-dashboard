<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:,">
<title>TS 蜘蛛网 · 每日信号</title>
<style>
:root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#14263c;background:#f3f6fa;font-size:14px;--line:#d9e2ee;--muted:#50647d;--accent:#17458b}
*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:auto;padding:32px 24px 24px}
a{color:var(--accent);text-underline-offset:3px}header{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:21px}
h1,h2,p{margin:0}h1{font-size:clamp(27px,5vw,43px);letter-spacing:-.045em;line-height:1.2}h2{font-size:19px}
.subtitle{color:var(--muted);margin-top:7px}time,.number{font-variant-numeric:tabular-nums}.date{font-size:14px;white-space:nowrap;color:var(--accent);font-weight:700}
.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:18px 20px;margin-bottom:16px;box-shadow:0 3px 12px #172c4910}
.heading{display:flex;flex-wrap:wrap;gap:9px 14px;align-items:center;justify-content:space-between;margin-bottom:13px}
.muted,small{color:var(--muted)}.status{border-radius:999px;padding:3px 8px;background:#eaf1fb;color:#17458b;display:inline-block;white-space:nowrap;font-weight:600}
.status.long{background:#e2f3eb;color:#146245}.status.short{background:#fbece9;color:#943419}.status.missing{background:#fff0ce;color:#674900}
table{width:100%;text-align:left;border-collapse:collapse}th,td{padding:11px 8px;border-bottom:1px solid #e8edf4;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}tbody tr:last-child td{border-bottom:0}.strategy{font-weight:700;display:block}.strategy small{display:block;font-weight:400;margin-top:3px;line-height:1.45}
.scroll{overflow-x:auto}.scroll table{min-width:600px}
select{font:inherit;border:1px solid var(--line);border-radius:7px;background:white;color:#14263c;padding:5px 7px}
#chart{width:100%;display:block;min-height:195px}#chart text{fill:#50647d;font:12px system-ui,sans-serif}
.legend{display:flex;flex-wrap:wrap;gap:7px 16px;font-size:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.note{color:var(--muted);line-height:1.65;font-size:12px;margin:9px 0 0}.links{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px}
footer{padding:2px 1px 8px}.empty{padding:10px 0;color:var(--muted)}
@media(max-width:620px){main{padding:20px 12px}header{display:block}.date{display:block;margin-top:9px}.panel{padding:13px 12px}
 .signals thead{display:none}.signals tbody{display:grid;gap:0}.signals tr{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:10px 0;border-bottom:1px solid #e8edf4}.signals tr:last-child{border:0}.signals td{border:0;padding:2px 0}.signals td:first-child{grid-column:1/-1}.signals td:last-child{grid-column:1/-1}.signals td[data-label]::before{content:attr(data-label) " ";font-size:11px;color:var(--muted)}}
</style>
</head>
<body><main>
<header><div><h1>TS 蜘蛛网 · 每日信号</h1><p class="subtitle" id="source"></p></div>
<time class="date" datetime="__ASOF__">信号日期 __ASOF__</time></header>
<section class="panel" aria-labelledby="signal-title">
<div class="heading"><h2 id="signal-title">盘后信号</h2><span class="muted" id="delta"></span></div>
<table class="signals"><thead><tr><th>策略</th><th>当日触发</th><th>盘后仓位</th><th>下一步</th></tr></thead><tbody id="signals"></tbody></table>
<p class="note">仓位和开平仓动作均来自策略模拟。交易日按中金所日历顺延。</p>
</section>
<section class="panel" aria-labelledby="nav-title">
<div class="heading"><h2 id="nav-title">净值对比</h2><label class="muted">区间 <select id="range">
<option value="all">全样本</option><option value="year">今年以来</option><option value="recent">近 120 个交易日</option></select></label></div>
<svg id="chart" viewBox="0 0 900 255" role="img" aria-label="五个策略的累计净值曲线"></svg>
<div class="legend" id="legend"></div><p class="note">固定 5 手 TS，每笔来回扣 0.005 点，净值每日盯市。切换区间后起点重置为 1。</p>
</section>
<section class="panel" aria-labelledby="stats-title">
<div class="heading"><h2 id="stats-title">策略表现</h2><span class="muted" id="span"></span></div>
<div class="scroll"><table><thead><tr><th>策略</th><th>累计收益</th><th>夏普</th><th>最大回撤</th><th>已平仓</th><th>2024 年起筛选段收益</th></tr></thead><tbody id="metrics"></tbody></table></div>
<p class="note" id="method"></p><p class="note" id="forward"></p>
</section>
<footer><div class="links"><a href="../../">FICC 看板</a><a href="TS_蜘蛛网_策略回测.html">静态版回测</a><a href="TS_蜘蛛网_持仓整理.html">持仓数据</a><a href="TS_平安纯多头_策略.html">平安纯多研究</a><a href="TS_席位对比_净值.html">九席位研究</a><a href="TS_每日信号.json">信号 JSON</a><a href="TS_前瞻记录.json">前瞻记录</a><a href="README.md">计算说明</a></div></footer>
</main>
<script type="application/json" id="data">__PAYLOAD__</script>
<script>
const d=JSON.parse(document.getElementById('data').textContent);
const $=id=>document.getElementById(id);
const pct=v=>(100*v).toFixed(2)+'%';
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
$('source').textContent=d.source+' · 收盘后更新';
$('delta').textContent='TS 日变动 '+(d.close_change>0?'+':'')+d.close_change.toFixed(3)+' 点';
$('span').textContent=d.start+' 至 '+d.asof;
$('method').textContent='以 '+d.selection_end+' 为筛选截止日。完整历史期收益和夏普等权排序，保留全期和 2024 年起筛选段扣成本后都为正、且有至少 40 笔的候选。五条规则固定跟踪。';
$('forward').textContent='前瞻从 '+d.forward.start+' 起算，已记录 '+d.forward.sessions+' 个交易日、'+d.forward.closed+' 笔已平仓交易。';
$('signals').innerHTML=d.strategies.map(s=>{
  const kind={多:'long',空:'short',数据缺失:'missing'}[s.raw]||'';
  return '<tr><td><span class="strategy">'+esc(s.name)+'<small>'+esc(s.rule)+'</small></span></td>'+
  '<td data-label="触发"><span class="status '+kind+'">'+esc(s.raw)+'</span></td>'+
  '<td data-label="仓位">'+esc(s.position)+(s.entry?' <small>'+esc(s.entry)+' 开仓</small>':'')+'</td>'+
  '<td data-label="下一步">'+esc(s.action)+'</td></tr>';
}).join('');
$('metrics').innerHTML=d.strategies.map(s=>'<tr><td class="strategy">'+esc(s.name)+'</td>'+
  [pct(s.total),s.sharpe.toFixed(2),pct(s.drawdown),s.trades,pct(s.validation)].map(x=>'<td class="number">'+x+'</td>').join('')+'</tr>').join('');
$('legend').innerHTML=d.strategies.map(s=>'<span><i class="dot" style="background:'+s.color+'"></i>'+esc(s.name)+'</span>').join('');
function plot(){
  const n=d.dates.length;
  const choice=$('range').value;
  const start=choice==='recent'?Math.max(0,n-120):choice==='year'?Math.max(0,d.dates.findIndex(x=>x.startsWith(d.asof.slice(0,4)))):0;
  const curves=d.strategies.map(s=>{
    const curve=d.nav[s.name], base=start?curve[start-1]:1;
    return {color:s.color, values:curve.slice(start).map(x=>x/base)};
  });
  const all=curves.flatMap(c=>c.values);
  const min=Math.min(...all,1), max=Math.max(...all,1), margin=Math.max((max-min)*.08,.0005);
  const low=min-margin, high=max+margin;
  const width=Math.max(280,$('chart').clientWidth), right=width-14;
  $('chart').setAttribute('viewBox','0 0 '+width+' 255');
  const x=i=>60+(right-60)*i/Math.max(1,n-start-1);
  const y=v=>219-204*(v-low)/(high-low);
  let html='';
  for(let j=0;j<=4;j++){
    const value=low+(high-low)*j/4, yy=y(value);
    html+='<path d="M60 '+yy+'H'+right+'" stroke="#e3eaf2"/><text x="52" y="'+(yy+4)+'" text-anchor="end">'+value.toFixed(3)+'</text>';
  }
  const ticks=Math.min(width<500?2:4,n-start-1);
  for(let j=0;j<=ticks;j++){
    const i=ticks?Math.round((n-start-1)*j/ticks):0;
    html+='<text x="'+x(i)+'" y="246" text-anchor="'+(j===0?'start':j===ticks?'end':'middle')+'">'+d.dates[start+i]+'</text>';
  }
  for(const curve of curves){
    const points=curve.values.map((v,i)=>x(i).toFixed(2)+','+y(v).toFixed(2)).join(' ');
    html+='<polyline fill="none" stroke="'+curve.color+'" stroke-width="2" vector-effect="non-scaling-stroke" points="'+points+'"/>';
  }
  $('chart').innerHTML=html;
}
$('range').addEventListener('change',plot);
window.addEventListener('resize',plot);
plot();
</script></body></html>
