<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>研究结论库</title>
<style>
  :root {
    --bg: #f5f6fa;
    --panel-bg: #ffffff;
    --text: #2c3e50;
    --text-secondary: #7f8c8d;
    --border: #e8ecf1;
    --primary: #5470c6;
    --primary-light: #e8edff;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --radius: 8px;
    --success: #22c55e;
    --danger: #ef4444;
    --accent: #ee6666;
    --hover: #f0f3f8;
    /* 状态色 */
    --st-active: #22c55e;
    --st-watch: #f59e0b;
    --st-pause: #6b7280;
    --st-drop: #ef4444;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ============ 顶栏 ============ */
  .topbar {
    background: var(--panel-bg);
    border-bottom: 1px solid var(--border);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow);
    position: sticky; top: 0; z-index: 100;
  }
  .topbar-left { display: flex; align-items: center; gap: 16px; }
  .topbar h1 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .topbar h1 .icon { font-size: 24px; }
  .topbar .subtitle { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .back-home {
    font-size: 12px; color: var(--text-secondary);
    text-decoration: none; padding: 5px 12px;
    border: 1px solid var(--border); border-radius: 4px;
    transition: all 0.15s;
  }
  .back-home:hover { color: var(--primary); border-color: var(--primary); }

  .topbar-actions { display: flex; gap: 8px; align-items: center; }
  .btn {
    padding: 7px 14px; border-radius: 6px; font-size: 13px; font-weight: 600;
    cursor: pointer; border: none; transition: all .15s; font-family: inherit;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: #4458b0; }
  .btn-outline { background: var(--panel-bg); color: var(--text-secondary); border: 1px solid var(--border); }
  .btn-outline:hover { color: var(--primary); border-color: var(--primary); background: var(--primary-light); }
  .btn-danger { background: #fee2e2; color: #dc2626; }
  .btn-danger:hover { background: #fecaca; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }

  /* ============ 筛选栏 ============ */
  .filter-bar {
    background: var(--panel-bg);
    border-bottom: 1px solid var(--border);
    padding: 12px 32px;
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  }
  .filter-group { display: flex; align-items: center; gap: 6px; }
  .filter-label { font-size: 12px; color: var(--text-secondary); font-weight: 600; }
  .status-tabs { display: flex; gap: 4px; }
  .status-tab {
    padding: 4px 12px; border-radius: 14px; font-size: 12px;
    cursor: pointer; border: 1px solid var(--border);
    background: var(--bg); color: var(--text-secondary);
    transition: all .15s; user-select: none;
  }
  .status-tab:hover { border-color: var(--primary); color: var(--primary); }
  .status-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .status-tab .count { font-size: 10px; opacity: .8; margin-left: 3px; }

  .tag-filter { display: flex; gap: 5px; flex-wrap: wrap; max-width: 480px; }
  .tag-chip {
    padding: 3px 10px; border-radius: 12px; font-size: 11px;
    cursor: pointer; border: 1px solid var(--border);
    background: var(--bg); color: var(--text-secondary);
    transition: all .15s;
  }
  .tag-chip:hover { border-color: var(--primary); color: var(--primary); }
  .tag-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  .search-box {
    margin-left: auto;
    position: relative;
  }
  .search-box input {
    padding: 6px 12px 6px 30px; border: 1px solid var(--border);
    border-radius: 6px; font-size: 12px; width: 220px;
    background: var(--bg); outline: none; font-family: inherit;
  }
  .search-box input:focus { border-color: var(--primary); background: var(--panel-bg); }
  .search-box::before {
    content: '🔍'; position: absolute; left: 9px; top: 50%;
    transform: translateY(-50%); font-size: 11px; opacity: .6;
  }

  /* ============ 主体 ============ */
  .main { padding: 20px 32px 60px; max-width: 1400px; margin: 0 auto; }

  .result-meta {
    font-size: 12px; color: var(--text-secondary); margin-bottom: 12px;
    display: flex; align-items: center; gap: 12px;
  }

  .card-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px; }

  .conclusion-card {
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: all .15s;
    display: flex; flex-direction: column; gap: 10px;
    position: relative; overflow: hidden;
  }
  .conclusion-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--st-color, var(--primary));
  }
  .conclusion-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.08); }

  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .card-title { font-size: 14px; font-weight: 700; line-height: 1.4; flex: 1; }
  .status-badge {
    padding: 2px 9px; border-radius: 10px; font-size: 10px; font-weight: 600;
    white-space: nowrap; flex-shrink: 0;
  }
  .status-badge.有效 { background: #dcfce7; color: #16a34a; }
  .status-badge.观察 { background: #fef3c7; color: #d97706; }
  .status-badge.暂停 { background: #f3f4f6; color: #6b7280; }
  .status-badge.废弃 { background: #fee2e2; color: #dc2626; }

  .card-tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .card-tag { font-size: 10px; padding: 1px 7px; border-radius: 8px; background: var(--primary-light); color: var(--primary); }
  .card-target { font-size: 11px; color: var(--text-secondary); }
  .card-target b { color: var(--text); font-weight: 600; }

  .card-section { font-size: 12px; line-height: 1.55; color: var(--text); }
  .card-section .lbl { font-size: 10px; color: var(--text-secondary); font-weight: 600; margin-bottom: 2px; }
  .card-section .txt { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

  .card-foot {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 8px; border-top: 1px dashed var(--border);
    font-size: 11px; color: var(--text-secondary);
  }
  .card-foot .source-tag {
    padding: 1px 6px; border-radius: 4px; font-size: 10px;
    background: var(--bg); border: 1px solid var(--border);
  }
  .card-foot .source-tag.factor { color: var(--primary); border-color: var(--primary); }
  .card-actions { display: flex; gap: 4px; }

  .empty-state {
    text-align: center; padding: 80px 20px; color: var(--text-secondary);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: .6; }
  .empty-state h3 { font-size: 16px; margin-bottom: 6px; color: var(--text); }
  .empty-state p { font-size: 13px; margin-bottom: 16px; }

  /* ============ 模态框 ============ */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.4);
    display: none; align-items: flex-start; justify-content: center;
    z-index: 1000; padding: 30px 16px; overflow-y: auto;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: var(--panel-bg); border-radius: 10px;
    width: 100%; max-width: 820px; box-shadow: 0 12px 36px rgba(0,0,0,.2);
    display: flex; flex-direction: column; max-height: calc(100vh - 60px);
  }
  .modal-head {
    padding: 16px 24px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .modal-head h2 { font-size: 16px; font-weight: 700; }
  .modal-close { font-size: 22px; cursor: pointer; color: var(--text-secondary); background: none; border: none; line-height: 1; padding: 0 4px; }
  .modal-close:hover { color: var(--text); }
  .modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; }
  .modal-foot {
    padding: 14px 24px; border-top: 1px solid var(--border);
    display: flex; justify-content: flex-end; gap: 8px; flex-shrink: 0;
    background: var(--bg); border-radius: 0 0 10px 10px;
  }

  .form-section { margin-bottom: 22px; }
  .form-section-title {
    font-size: 12px; font-weight: 700; color: var(--primary);
    margin-bottom: 10px; padding-bottom: 4px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 6px;
  }
  .form-section-title .req { color: var(--danger); font-size: 10px; font-weight: 600; }
  .form-section-title .opt { color: var(--text-secondary); font-size: 10px; font-weight: 500; }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 10px; }
  .form-row.single { grid-template-columns: 1fr; }
  .form-field { display: flex; flex-direction: column; gap: 4px; }
  .form-field label { font-size: 11px; color: var(--text-secondary); font-weight: 600; }
  .form-field label .req { color: var(--danger); }
  .form-field input, .form-field select, .form-field textarea {
    padding: 7px 10px; border: 1px solid var(--border); border-radius: 5px;
    font-size: 13px; font-family: inherit; background: var(--bg); outline: none;
    transition: border-color .15s;
  }
  .form-field input:focus, .form-field select:focus, .form-field textarea:focus {
    border-color: var(--primary); background: var(--panel-bg);
  }
  .form-field textarea { resize: vertical; min-height: 70px; line-height: 1.5; }
  .form-field textarea.tall { min-height: 110px; }
  .form-field .hint { font-size: 10px; color: var(--text-secondary); }

  .tag-input-wrap { display: flex; flex-wrap: wrap; gap: 5px; padding: 6px; border: 1px solid var(--border); border-radius: 5px; background: var(--bg); min-height: 36px; align-items: center; }
  .tag-input-wrap:focus-within { border-color: var(--primary); background: var(--panel-bg); }
  .tag-input-tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; background: var(--primary-light); color: var(--primary); border-radius: 10px; font-size: 11px; }
  .tag-input-tag .x { cursor: pointer; font-weight: 700; opacity: .7; }
  .tag-input-tag .x:hover { opacity: 1; }
  .tag-input-wrap input { border: none; background: none; outline: none; font-size: 12px; font-family: inherit; flex: 1; min-width: 80px; padding: 2px; }

  /* ============ 详情视图 ============ */
  .detail-view { padding: 4px 0; }
  .detail-head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px;
  }
  .detail-head h2 { font-size: 18px; font-weight: 700; line-height: 1.4; flex: 1; }
  .detail-meta { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11px; color: var(--text-secondary); margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
  .detail-meta span { display: flex; align-items: center; gap: 4px; }
  .detail-meta b { color: var(--text); font-weight: 600; }

  .detail-section { margin-bottom: 18px; }
  .detail-section .lbl {
    font-size: 12px; font-weight: 700; color: var(--primary);
    margin-bottom: 6px; display: flex; align-items: center; gap: 6px;
  }
  .detail-section .lbl::before {
    content: ''; width: 3px; height: 12px; background: var(--primary); border-radius: 2px;
  }
  .detail-section .content { font-size: 13px; line-height: 1.7; color: var(--text); white-space: pre-wrap; word-break: break-word; }
  .detail-section .content table { border-collapse: collapse; width: 100%; margin: 6px 0; font-size: 12px; }
  .detail-section .content th, .detail-section .content td { border: 1px solid var(--border); padding: 5px 9px; text-align: left; }
  .detail-section .content th { background: var(--bg); font-weight: 600; }

  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.8); color: #fff; padding: 10px 20px;
    border-radius: 6px; font-size: 13px; z-index: 2000;
    opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 768px) {
    .topbar { padding: 14px 18px; flex-wrap: wrap; gap: 10px; }
    .filter-bar { padding: 10px 18px; }
    .main { padding: 14px 18px 40px; }
    .card-list { grid-template-columns: 1fr; }
    .form-row { grid-template-columns: 1fr; }
    .search-box { margin-left: 0; width: 100%; }
    .search-box input { width: 100%; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <h1><span class="icon">📚</span>研究结论库</h1>
    <div>
      <div class="subtitle">沉淀因子效果与投研判断</div>
    </div>
  </div>
  <div class="topbar-actions">
    <a href="index.html" class="back-home">← 返回首页</a>
    <button class="btn btn-outline" onclick="document.getElementById('import-file').click()">📥 导入</button>
    <button class="btn btn-outline" onclick="exportData()">📤 导出</button>
    <button class="btn btn-primary" onclick="openEditor()">+ 新建结论</button>
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
  </div>
</div>

<div class="filter-bar">
  <div class="filter-group">
    <span class="filter-label">状态</span>
    <div class="status-tabs" id="status-tabs">
      <div class="status-tab active" data-status="all">全部 <span class="count" id="cnt-all">0</span></div>
      <div class="status-tab" data-status="有效">有效 <span class="count" id="cnt-有效">0</span></div>
      <div class="status-tab" data-status="观察">观察 <span class="count" id="cnt-观察">0</span></div>
      <div class="status-tab" data-status="暂停">暂停 <span class="count" id="cnt-暂停">0</span></div>
      <div class="status-tab" data-status="废弃">废弃 <span class="count" id="cnt-废弃">0</span></div>
    </div>
  </div>
  <div class="filter-group">
    <span class="filter-label">标签</span>
    <div class="tag-filter" id="tag-filter"><span style="font-size:11px;color:var(--text-secondary)">无</span></div>
  </div>
  <div class="search-box">
    <input type="text" id="search-input" placeholder="搜索标题/问题/结论...">
  </div>
</div>

<div class="main">
  <div class="result-meta" id="result-meta"></div>
  <div id="card-container"></div>
</div>

<!-- 编辑模态框 -->
<div class="modal-mask" id="editor-mask">
  <div class="modal">
    <div class="modal-head">
      <h2 id="editor-title">新建研究结论</h2>
      <button class="modal-close" onclick="closeEditor()">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="f-id">

      <div class="form-section">
        <div class="form-section-title">核心信息 <span class="req">必填</span></div>
        <div class="form-row single">
          <div class="form-field">
            <label>标题 <span class="req">*</span></label>
            <input type="text" id="f-title" placeholder="例如：基金超长债净买入因子对 TL 多头的预测效果">
          </div>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label>状态 <span class="req">*</span></label>
            <select id="f-status">
              <option value="有效">有效</option>
              <option value="观察" selected>观察</option>
              <option value="暂停">暂停</option>
              <option value="废弃">废弃</option>
            </select>
          </div>
          <div class="form-field">
            <label>交易对象 <span class="req">*</span></label>
            <input type="text" id="f-target" placeholder="例如：TL 主力合约 / 30Y 国债 / 10Y 国债">
          </div>
        </div>
        <div class="form-row single">
          <div class="form-field">
            <label>标签 <span class="req">*</span>（回车添加，至少 1 个）</label>
            <div class="tag-input-wrap" id="tag-input-wrap">
              <input type="text" id="tag-input" placeholder="如：基金/超长债/TL/多头">
            </div>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">研究问题与结论 <span class="req">必填</span></div>
        <div class="form-row single">
          <div class="form-field">
            <label>研究问题 <span class="req">*</span></label>
            <textarea id="f-question" placeholder="这条研究想回答什么？例如：当基金在超长债上持续净买入时，是否意味着长端利率下行概率提高？能否作为 TL 多头信号？"></textarea>
          </div>
        </div>
        <div class="form-row single">
          <div class="form-field">
            <label>投资结论 <span class="req">*</span></label>
            <textarea id="f-conclusion" class="tall" placeholder="用人话总结：这个因子怎么用？是单独开仓信号还是确认信号？什么环境下有效/失效？"></textarea>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">信号定义与触发 <span class="opt">可选（从因子分析页跳转会自动填）</span></div>
        <div class="form-row single">
          <div class="form-field">
            <label>信号定义</label>
            <textarea id="f-signalDef" placeholder="机构 / 券种 / 期限 / 原始变量 / 平滑方式 / 标准化方式"></textarea>
          </div>
        </div>
        <div class="form-row single">
          <div class="form-field">
            <label>触发条件</label>
            <textarea id="f-trigger" placeholder="多头/退出信号、过滤条件、持有周期等"></textarea>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">历史验证结果 <span class="opt">可选（支持 Markdown 表格）</span></div>
        <div class="form-row single">
          <div class="form-field">
            <label>统计结果</label>
            <textarea id="f-stats" class="tall" placeholder="可粘贴表格，例如：&#10;| 指标 | 未来5日 | 未来10日 |&#10;|------|---------|----------|&#10;| 胜率 | 59% | 64% |"></textarea>
            <span class="hint">支持 Markdown 表格语法，详情页会渲染成表格</span>
          </div>
        </div>
        <div class="form-row single">
          <div class="form-field">
            <label>分环境表现</label>
            <textarea id="f-envPerformance" placeholder="按市场环境（资金宽松/中性/偏紧等）拆分的胜率与收益"></textarea>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">典型案例 <span class="opt">可选</span></div>
        <div class="form-row single">
          <div class="form-field">
            <label>历史触发日期与表现</label>
            <textarea id="f-cases" placeholder="例如：&#10;2026-03-12：信号触发后 TL 走强&#10;2026-04-18：信号触发但资金收紧，表现失败"></textarea>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" onclick="closeEditor()">取消</button>
      <button class="btn btn-primary" onclick="saveConclusion()">保存</button>
    </div>
  </div>
</div>

<!-- 详情模态框 -->
<div class="modal-mask" id="detail-mask">
  <div class="modal">
    <div class="modal-head">
      <h2>结论详情</h2>
      <button class="modal-close" onclick="closeDetail()">×</button>
    </div>
    <div class="modal-body" id="detail-body"></div>
    <div class="modal-foot">
      <button class="btn btn-danger" onclick="deleteCurrent()">删除</button>
      <button class="btn btn-outline" onclick="closeDetail()">关闭</button>
      <button class="btn btn-primary" onclick="editFromDetail()">编辑</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================
// 常量与状态
// ============================================
const STORAGE_KEY = 'ficc_research_conclusions';
const STATUSES = ['有效', '观察', '暂停', '废弃'];
let conclusions = [];
let filterStatus = 'all';
let filterTags = new Set();
let searchKeyword = '';
let editingTags = [];
let currentDetailId = null;

// ============================================
// 存储
// ============================================
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    conclusions = raw ? JSON.parse(raw) : [];
  } catch (e) {
    console.error('加载失败', e);
    conclusions = [];
  }
}
function persist() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(conclusions));
}
function genId() {
  return 'rc_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
}
function nowStr() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// ============================================
// 渲染
// ============================================
function getAllTags() {
  const set = new Set();
  conclusions.forEach(c => (c.tags || []).forEach(t => set.add(t)));
  return Array.from(set).sort();
}

function renderFilterBar() {
  // 状态计数
  document.getElementById('cnt-all').textContent = conclusions.length;
  STATUSES.forEach(s => {
    document.getElementById('cnt-' + s).textContent = conclusions.filter(c => c.status === s).length;
  });

  // 标签
  const tags = getAllTags();
  const wrap = document.getElementById('tag-filter');
  if (tags.length === 0) {
    wrap.innerHTML = '<span style="font-size:11px;color:var(--text-secondary)">暂无标签</span>';
  } else {
    wrap.innerHTML = tags.map(t =>
      `<div class="tag-chip ${filterTags.has(t)?'active':''}" onclick="toggleTagFilter('${t.replace(/'/g,"\\'")}')">${t}</div>`
    ).join('');
  }
}

function getFiltered() {
  return conclusions.filter(c => {
    if (filterStatus !== 'all' && c.status !== filterStatus) return false;
    if (filterTags.size > 0 && !(c.tags || []).some(t => filterTags.has(t))) return false;
    if (searchKeyword) {
      const kw = searchKeyword.toLowerCase();
      const hay = [c.title, c.question, c.conclusion, c.target, (c.tags||[]).join(' '), c.signalDef, c.trigger, c.stats, c.envPerformance, c.cases].join(' ').toLowerCase();
      if (!hay.includes(kw)) return false;
    }
    return true;
  }).sort((a, b) => {
    // 有效置顶，再按更新时间倒序
    const order = { '有效': 0, '观察': 1, '暂停': 2, '废弃': 3 };
    if (order[a.status] !== order[b.status]) return order[a.status] - order[b.status];
    return (b.updatedAt || '').localeCompare(a.updatedAt || '');
  });
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function renderList() {
  const list = getFiltered();
  const meta = document.getElementById('result-meta');
  meta.innerHTML = `共 <b>${list.length}</b> 条${filterStatus!=='all' || filterTags.size>0 || searchKeyword ? `（筛选自 ${conclusions.length} 条）` : ''}`;

  const container = document.getElementById('card-container');
  if (list.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="icon">📝</div>
        <h3>${conclusions.length === 0 ? '还没有研究结论' : '没有匹配的结论'}</h3>
        <p>${conclusions.length === 0 ? '从因子分析页「保存为研究结论」，或点右上角新建' : '试试调整筛选条件'}</p>
        ${conclusions.length === 0 ? '<button class="btn btn-primary" onclick="openEditor()">+ 新建第一条结论</button>' : ''}
      </div>`;
    return;
  }

  container.innerHTML = `<div class="card-list">${list.map(c => renderCard(c)).join('')}</div>`;
}

function renderCard(c) {
  const stColor = { '有效':'var(--st-active)', '观察':'var(--st-watch)', '暂停':'var(--st-pause)', '废弃':'var(--st-drop)' }[c.status] || 'var(--primary)';
  const tagsHtml = (c.tags || []).slice(0, 5).map(t => `<span class="card-tag">${escapeHtml(t)}</span>`).join('') +
    ((c.tags||[]).length > 5 ? `<span class="card-tag">+${c.tags.length-5}</span>` : '');
  const qPreview = c.question ? escapeHtml(c.question).slice(0, 90) : '<span style="color:var(--text-secondary);font-style:italic">未填写研究问题</span>';
  const cPreview = c.conclusion ? escapeHtml(c.conclusion).slice(0, 120) : '<span style="color:var(--text-secondary);font-style:italic">未填写投资结论</span>';
  const sourceTag = c.source === 'factor'
    ? '<span class="source-tag factor">来自因子分析</span>'
    : '<span class="source-tag">手动</span>';

  return `
    <div class="conclusion-card" style="--st-color:${stColor}" onclick="openDetail('${c.id}')">
      <div class="card-head">
        <div class="card-title">${escapeHtml(c.title)}</div>
        <span class="status-badge ${c.status}">${c.status}</span>
      </div>
      ${tagsHtml ? `<div class="card-tags">${tagsHtml}</div>` : ''}
      <div class="card-target">交易对象：<b>${escapeHtml(c.target || '未指定')}</b></div>
      <div class="card-section">
        <div class="lbl">研究问题</div>
        <div class="txt">${qPreview}</div>
      </div>
      <div class="card-section">
        <div class="lbl">投资结论</div>
        <div class="txt">${cPreview}</div>
      </div>
      <div class="card-foot">
        <span>${sourceTag} 更新于 ${escapeHtml(c.updatedAt || c.createdAt || '')}</span>
        <div class="card-actions">
          <button class="btn btn-outline btn-sm" onclick="event.stopPropagation();openEditor('${c.id}')">编辑</button>
        </div>
      </div>
    </div>`;
}

// ============================================
// 筛选交互
// ============================================
document.getElementById('status-tabs').addEventListener('click', e => {
  const tab = e.target.closest('.status-tab');
  if (!tab) return;
  document.querySelectorAll('.status-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  filterStatus = tab.dataset.status;
  renderList();
});
function toggleTagFilter(t) {
  if (filterTags.has(t)) filterTags.delete(t); else filterTags.add(t);
  renderFilterBar();
  renderList();
}
document.getElementById('search-input').addEventListener('input', e => {
  searchKeyword = e.target.value.trim();
  renderList();
});

// ============================================
// 编辑器
// ============================================
function openEditor(id) {
  const c = id ? conclusions.find(x => x.id === id) : null;
  document.getElementById('editor-title').textContent = c ? '编辑研究结论' : '新建研究结论';
  document.getElementById('f-id').value = c ? c.id : '';
  document.getElementById('f-title').value = c ? (c.title || '') : '';
  document.getElementById('f-status').value = c ? (c.status || '观察') : '观察';
  document.getElementById('f-target').value = c ? (c.target || '') : '';
  document.getElementById('f-question').value = c ? (c.question || '') : '';
  document.getElementById('f-conclusion').value = c ? (c.conclusion || '') : '';
  document.getElementById('f-signalDef').value = c ? (c.signalDef || '') : '';
  document.getElementById('f-trigger').value = c ? (c.trigger || '') : '';
  document.getElementById('f-stats').value = c ? (c.stats || '') : '';
  document.getElementById('f-envPerformance').value = c ? (c.envPerformance || '') : '';
  document.getElementById('f-cases').value = c ? (c.cases || '') : '';
  editingTags = c ? [...(c.tags || [])] : [];
  renderTagInput();
  document.getElementById('editor-mask').classList.add('show');
}
function closeEditor() {
  document.getElementById('editor-mask').classList.remove('show');
}

function renderTagInput() {
  const wrap = document.getElementById('tag-input-wrap');
  const input = document.getElementById('tag-input');
  // 保留 input 元素
  wrap.querySelectorAll('.tag-input-tag').forEach(el => el.remove());
  editingTags.forEach((t, i) => {
    const el = document.createElement('span');
    el.className = 'tag-input-tag';
    el.innerHTML = `${escapeHtml(t)} <span class="x" onclick="removeTag(${i})">×</span>`;
    wrap.insertBefore(el, input);
  });
}
function removeTag(i) {
  editingTags.splice(i, 1);
  renderTagInput();
}
document.getElementById('tag-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault();
    const v = e.target.value.trim();
    if (v && !editingTags.includes(v)) {
      editingTags.push(v);
      renderTagInput();
    }
    e.target.value = '';
  } else if (e.key === 'Backspace' && e.target.value === '' && editingTags.length > 0) {
    editingTags.pop();
    renderTagInput();
  }
});

function saveConclusion() {
  const title = document.getElementById('f-title').value.trim();
  const question = document.getElementById('f-question').value.trim();
  const conclusion = document.getElementById('f-conclusion').value.trim();
  const target = document.getElementById('f-target').value.trim();
  const status = document.getElementById('f-status').value;

  if (!title) { toast('请填写标题'); return; }
  if (!question) { toast('请填写研究问题'); return; }
  if (!conclusion) { toast('请填写投资结论'); return; }
  if (!target) { toast('请填写交易对象'); return; }
  if (editingTags.length === 0) { toast('请至少添加 1 个标签'); return; }

  const id = document.getElementById('f-id').value;
  const now = nowStr();
  const existing = id ? conclusions.find(x => x.id === id) : null;

  const obj = {
    id: id || genId(),
    title, question, conclusion, target, status,
    tags: [...editingTags],
    signalDef: document.getElementById('f-signalDef').value.trim(),
    trigger: document.getElementById('f-trigger').value.trim(),
    stats: document.getElementById('f-stats').value.trim(),
    envPerformance: document.getElementById('f-envPerformance').value.trim(),
    cases: document.getElementById('f-cases').value.trim(),
    source: existing ? existing.source : 'manual',
    createdAt: existing ? existing.createdAt : now,
    updatedAt: now,
  };

  if (existing) {
    Object.assign(existing, obj);
  } else {
    conclusions.unshift(obj);
  }
  persist();
  closeEditor();
  renderFilterBar();
  renderList();
  toast(existing ? '已更新' : '已保存');
}

// ============================================
// 详情视图
// ============================================
function openDetail(id) {
  const c = conclusions.find(x => x.id === id);
  if (!c) return;
  currentDetailId = id;
  const stColor = { '有效':'var(--st-active)', '观察':'var(--st-watch)', '暂停':'var(--st-pause)', '废弃':'var(--st-drop)' }[c.status];
  const tagsHtml = (c.tags || []).map(t => `<span class="card-tag">${escapeHtml(t)}</span>`).join('');

  let html = `<div class="detail-view">
    <div class="detail-head">
      <h2>${escapeHtml(c.title)}</h2>
      <span class="status-badge ${c.status}">${c.status}</span>
    </div>
    <div class="detail-meta">
      <span>交易对象：<b>${escapeHtml(c.target || '未指定')}</b></span>
      <span>创建：${escapeHtml(c.createdAt || '')}</span>
      <span>更新：${escapeHtml(c.updatedAt || '')}</span>
      <span>来源：${c.source === 'factor' ? '因子分析页' : '手动新建'}</span>
    </div>
    ${tagsHtml ? `<div style="margin-bottom:18px">${tagsHtml}</div>` : ''}`;

  const sections = [
    ['研究问题', c.question],
    ['信号定义', c.signalDef],
    ['触发条件', c.trigger],
    ['历史验证结果', c.stats],
    ['分环境表现', c.envPerformance],
    ['典型案例', c.cases],
    ['投资结论', c.conclusion],
  ];
  sections.forEach(([lbl, val]) => {
    if (val && val.trim()) {
      html += `<div class="detail-section">
        <div class="lbl">${lbl}</div>
        <div class="content">${renderMarkdown(val)}</div>
      </div>`;
    }
  });
  html += `</div>`;
  document.getElementById('detail-body').innerHTML = html;
  document.getElementById('detail-mask').classList.add('show');
}
function closeDetail() {
  document.getElementById('detail-mask').classList.remove('show');
  currentDetailId = null;
}
function editFromDetail() {
  const id = currentDetailId;
  closeDetail();
  openEditor(id);
}
function deleteCurrent() {
  if (!currentDetailId) return;
  if (!confirm('确认删除这条研究结论？此操作不可撤销。')) return;
  conclusions = conclusions.filter(c => c.id !== currentDetailId);
  persist();
  closeDetail();
  renderFilterBar();
  renderList();
  toast('已删除');
}

// 简易 Markdown：表格 + 换行 + 加粗
function renderMarkdown(text) {
  let html = escapeHtml(text);
  // 表格
  const lines = html.split('\n');
  let result = [];
  let i = 0;
  while (i < lines.length) {
    if (lines[i].includes('|') && i + 1 < lines.length && /^\s*\|?[\s\-:|]+\|?\s*$/.test(lines[i+1])) {
      // 找表格
      const tableLines = [];
      tableLines.push(lines[i]); i += 2; // 跳过分隔行
      while (i < lines.length && lines[i].includes('|')) { tableLines.push(lines[i]); i++; }
      // 解析
      const parseRow = l => l.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(c => c.trim());
      const header = parseRow(tableLines[0]);
      let t = '<table><thead><tr>' + header.map(h => `<th>${h}</th>`).join('') + '</tr></thead><tbody>';
      for (let r = 1; r < tableLines.length; r++) {
        const row = parseRow(tableLines[r]);
        t += '<tr>' + row.map(c => `<td>${c}</td>`).join('') + '</tr>';
      }
      t += '</tbody></table>';
      result.push(t);
    } else {
      result.push(lines[i]);
      i++;
    }
  }
  html = result.join('\n');
  // 加粗
  html = html.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  // 换行
  html = html.replace(/\n/g, '<br>');
  // 表格内的 <br> 修正（表格已含 tr/td，不应有 br）
  html = html.replace(/<table>([\s\S]*?)<\/table>/g, (m, inner) => '<table>' + inner.replace(/<br>/g, '') + '</table>');
  return html;
}

// ============================================
// 导入导出
// ============================================
function exportData() {
  if (conclusions.length === 0) { toast('没有可导出的数据'); return; }
  const blob = new Blob([JSON.stringify(conclusions, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `研究结论库_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast(`已导出 ${conclusions.length} 条`);
}
function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data)) { toast('文件格式错误：应为数组'); return; }
      let add = 0, update = 0;
      data.forEach(item => {
        if (!item.id) item.id = genId();
        const idx = conclusions.findIndex(c => c.id === item.id);
        if (idx >= 0) { conclusions[idx] = item; update++; }
        else { conclusions.unshift(item); add++; }
      });
      persist();
      renderFilterBar();
      renderList();
      toast(`导入完成：新增 ${add} 条，更新 ${update} 条`);
    } catch (err) {
      toast('导入失败：' + err.message);
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

// ============================================
// 预填（从因子分析页跳转）
// ============================================
function tryApplyPrefill() {
  const params = new URLSearchParams(location.search);
  if (params.get('prefill') !== '1') return;
  const raw = sessionStorage.getItem('fic_prefill_conclusion');
  if (!raw) return;
  sessionStorage.removeItem('fic_prefill_conclusion');
  try {
    const p = JSON.parse(raw);
    document.getElementById('f-id').value = '';
    document.getElementById('f-title').value = p.title || '';
    document.getElementById('f-status').value = p.status || '观察';
    document.getElementById('f-target').value = p.target || '';
    document.getElementById('f-question').value = p.question || '';
    document.getElementById('f-conclusion').value = p.conclusion || '';
    document.getElementById('f-signalDef').value = p.signalDef || '';
    document.getElementById('f-trigger').value = p.trigger || '';
    document.getElementById('f-stats').value = p.stats || '';
    document.getElementById('f-envPerformance').value = p.envPerformance || '';
    document.getElementById('f-cases').value = p.cases || '';
    editingTags = p.tags || [];
    document.getElementById('editor-title').textContent = '新建研究结论（已从因子分析预填）';
    renderTagInput();
    document.getElementById('editor-mask').classList.add('show');
    toast('已预填因子分析数据，请补充投资结论后保存');
  } catch (e) {
    console.error('预填失败', e);
  }
}

// ============================================
// Toast
// ============================================
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ============================================
// 启动
// ============================================
loadData();
renderFilterBar();
renderList();
tryApplyPrefill();

// 点击遮罩关闭
document.getElementById('editor-mask').addEventListener('click', e => { if (e.target === e.currentTarget) closeEditor(); });
document.getElementById('detail-mask').addEventListener('click', e => { if (e.target === e.currentTarget) closeDetail(); });
// ESC 关闭
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeEditor();
    closeDetail();
  }
});
</script>
